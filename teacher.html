<!-- Revenue Cards HTML -->
<div class="dashboard-summary">
    <div class="card">
        <h3>Total Monthly Revenue</h3>
        <h2 id="lblTotalRevenue">LKR 0.00</h2>
    </div>
    <div class="card">
        <h3>Total Payments Received</h3>
        <h2 id="lblTotalTransactions">0</h2>
    </div>
</div>

<table border="1" style="width:100%; margin-top: 20px;">
    <thead>
        <tr>
            <th>Date</th>
            <th>Student ID</th>
            <th>Name</th>
            <th>Grade</th>
            <th>Month</th>
            <th>Amount (LKR)</th>
        </tr>
    </thead>
    <tbody id="revenueTableBody">
        <tr><td colspan="6">Loading revenue data...</td></tr>
    </tbody>
</table>

<script>
    // Initialize Dashboard Live Listener
    function listenToMonthlyRevenue() {
        const now = new Date();
        const currentYearMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`; // e.g., '2026-09'

        // Real-time listener for the active month's revenue summary
        db.ref(`revenue/${currentYearMonth}`).on('value', (snapshot) => {
            if (!snapshot.exists()) {
                document.getElementById('lblTotalRevenue').innerText = 'LKR 0.00';
                document.getElementById('lblTotalTransactions').innerText = '0';
                document.getElementById('revenueTableBody').innerHTML = '<tr><td colspan="6">No payments recorded for this month.</td></tr>';
                return;
            }

            const data = snapshot.val();
            const totalAmount = data.totalAmount || 0;
            const transactions = data.transactions ? Object.values(data.transactions) : [];

            // Update Total Revenue Cards
            document.getElementById('lblTotalRevenue').innerText = `LKR ${totalAmount.toFixed(2)}`;
            document.getElementById('lblTotalTransactions').innerText = transactions.length;

            // Render Payment Transactions Table
            const tbody = document.getElementById('revenueTableBody');
            tbody.innerHTML = '';

            transactions.reverse().forEach((tx) => {
                const row = `
                    <tr>
                        <td>${tx.date}</td>
                        <td><strong>${tx.studentId}</strong></td>
                        <td>${tx.studentName}</td>
                        <td>${tx.grade}</td>
                        <td>${tx.month}</td>
                        <td><strong>LKR ${parseFloat(tx.amount).toFixed(2)}</strong></td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        });
    }

    // Call on page load
    window.onload = listenToMonthlyRevenue;
</script>
