<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fee Payment & QR Scanner</title>
    <link rel="icon" type="image/png" href="logo.png">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f4f8;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }

        h2 { text-align: center; color: #003366; margin-top: 0; }

        .nav-links {
            text-align: center;
            margin-bottom: 20px;
            font-size: 0.9em;
        }

        .nav-links a {
            text-decoration: none;
            color: #0056b3;
            font-weight: bold;
            margin: 0 8px;
        }

        .btn-qr-toggle {
            width: 100%;
            background: #0056b3;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.95em;
            margin-bottom: 15px;
        }

        #qr-reader-container {
            display: none;
            margin-bottom: 15px;
            border: 2px solid #0056b3;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }

        .upload-section {
            background: #e9ecef;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .form-group { margin-bottom: 15px; }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #0056b3;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1em;
        }

        .search-btn {
            background: #003366;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 10px 15px;
            cursor: pointer;
            font-weight: bold;
        }

        .student-details-card {
            background: #e9ecef;
            border-left: 4px solid #28a745;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: none;
        }

        .student-details-card p { margin: 4px 0; font-size: 0.95em; }

        .btn-submit {
            width: 100%;
            background: #28a745;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>💳 Class Fee Payment</h2>
        
        <div class="nav-links">
            <a href="index.html">📸 Scanner</a> | 
            <a href="register.html">+ New Register</a> | 
            <a href="fee.html">💳 Fee Payment</a> | 
            <a href="students_list.html">📚 Admin Panel</a>
        </div>

        <button type="button" class="btn-qr-toggle" onclick="toggleScanner()">
            📷 <span id="scannerToggleText">Open Camera QR Scanner</span>
        </button>

        <div id="qr-reader-container">
            <div id="reader"></div>
        </div>

        <div class="upload-section">
            <label for="feeQrFile">📁 Or Upload QR Image File:</label>
            <input type="file" id="feeQrFile" accept="image/*" onchange="uploadScanFeeQr(event)">
        </div>

        <div class="form-group">
            <label for="studentId">Student ID / Index No:</label>
            <div style="display: flex; gap: 8px;">
                <input type="text" id="studentId" placeholder="Enter or Scan ID..." required>
                <button type="button" class="search-btn" style="width: 80px;" onclick="loadStudentDetails()">Lookup</button>
            </div>
        </div>

        <div id="studentCard" class="student-details-card">
            <p><strong>Name:</strong> <span id="lblStudentName">-</span></p>
            <p><strong>Grade:</strong> <span id="lblGrade">-</span></p>
            <p><strong>Phone:</strong> <span id="lblPhone">-</span></p>
            <p><strong>Current Status:</strong> <span id="lblStatus">-</span></p>
        </div>

        <form id="feeForm">
            <div class="form-group">
                <label for="month">Payment Month:</label>
                <select id="month" required>
                    <option value="">Select Month</option>
                    <option value="January">January</option>
                    <option value="February">February</option>
                    <option value="March">March</option>
                    <option value="April">April</option>
                    <option value="May">May</option>
                    <option value="June">June</option>
                    <option value="July">July</option>
                    <option value="August">August</option>
                    <option value="September">September</option>
                    <option value="October">October</option>
                    <option value="November">November</option>
                    <option value="December">December</option>
                </select>
            </div>

            <div class="form-group">
                <label for="amount">Amount Paid (LKR):</label>
                <input type="number" id="amount" placeholder="e.g. 2000" required>
            </div>

            <button type="submit" class="btn-submit">💳 Record Payment & Send Receipt</button>
        </form>
    </div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAP97Utjqx54gmf9YaMsgWSK96TGTUCuSg",
        authDomain: "class-management-system-8c1a1.firebaseapp.com",
        databaseURL: "https://class-management-system-8c1a1-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "class-management-system-8c1a1",
        storageBucket: "class-management-system-8c1a1.firebasestorage.app",
        messagingSenderId: "759521896885",
        appId: "1:759521896885:web:ab834180d9ab45968791fc",
        measurementId: "G-XZW2VLFXT2"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let html5QrcodeScanner = null;
    let isScannerOpen = false;
    let loadedStudent = null;

    function toggleScanner() {
        const container = document.getElementById('qr-reader-container');
        const toggleText = document.getElementById('scannerToggleText');

        if (!isScannerOpen) {
            container.style.display = 'block';
            toggleText.innerText = 'Close Camera Scanner';
            isScannerOpen = true;

            html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: { width: 200, height: 200 } }, false);
            html5QrcodeScanner.render((decodedText) => {
                document.getElementById('studentId').value = decodedText.trim();
                loadStudentDetails();
                toggleScanner();
            });
        } else {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.clear();
            }
            container.style.display = 'none';
            toggleText.innerText = 'Open Camera QR Scanner';
            isScannerOpen = false;
        }
    }

    function uploadScanFeeQr(event) {
        const file = event.target.files[0];
        if (!file) return;

        const html5QrCode = new Html5Qrcode("reader");
        html5QrCode.scanFile(file, true)
            .then(decodedText => {
                document.getElementById('studentId').value = decodedText.trim();
                loadStudentDetails();
            })
            .catch(err => alert('❌ Failed to scan QR from uploaded image.'));
    }

    function loadStudentDetails() {
        const id = document.getElementById('studentId').value.trim();
        if (!id) return alert('⚠️ Please enter or scan a Student ID.');

        db.ref('students/' + id).once('value', (snapshot) => {
            if (!snapshot.exists()) {
                alert('❌ Student ID not found!');
                document.getElementById('studentCard').style.display = 'none';
                loadedStudent = null;
                return;
            }

            loadedStudent = snapshot.val();
            document.getElementById('lblStudentName').innerText = loadedStudent.name || 'N/A';
            document.getElementById('lblGrade').innerText = loadedStudent.grade || 'N/A';
            document.getElementById('lblPhone').innerText = loadedStudent.phone || loadedStudent.whatsapp || 'N/A';
            document.getElementById('lblStatus').innerText = loadedStudent.fee || 'Not Paid';
            document.getElementById('studentCard').style.display = 'block';
        });
    }

    document.getElementById('feeForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const id = document.getElementById('studentId').value.trim();
        const month = document.getElementById('month').value;
        const amount = document.getElementById('amount').value;

        if (!id || !loadedStudent) return alert('⚠️ Select or lookup student details first.');

        const paymentData = {
            fee: 'Paid',
            lastPaymentMonth: month,
            lastPaymentAmount: amount,
            lastPaymentDate: new Date().toISOString().split('T')[0]
        };

        db.ref('students/' + id).update(paymentData).then(() => {
            db.ref(`payments/${id}/${month}`).set({ amount: amount, paidDate: new Date().toISOString(), month: month });

            let rawPhone = loadedStudent.phone || loadedStudent.whatsapp || '';
            let phoneNum = rawPhone.replace(/\D/g, '');
            if (phoneNum.startsWith('0')) phoneNum = '94' + phoneNum.substring(1);

            const receiptMsg = `🧾 *FEE PAYMENT RECEIPT*\nStudent: ${loadedStudent.name} (${id})\nGrade: ${loadedStudent.grade}\nMonth: ${month}\nAmount Paid: LKR ${amount}\nStatus: SUCCESSFUL ✅\nThank you! - English with Sudan Sir`;

            alert('✅ Payment recorded successfully!');

            if (phoneNum) {
                window.open(`https://wa.me/${phoneNum}?text=${encodeURIComponent(receiptMsg)}`, '_blank');
            }

            document.getElementById('feeForm').reset();
            document.getElementById('studentId').value = '';
            document.getElementById('studentCard').style.display = 'none';
            loadedStudent = null;
        });
    });
</script>
</body>
</html>
