<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ගාස්තු ගෙවීම - English with Sudan Sir</title>
  <meta name="theme-color" content="#14246b">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="shared.css">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="shared.js"></script>
  <style>
    /* රූපයක් ලෙස සාදන රිසිට්පත (තිරයෙන් පිටත සඟවා ඇත) */
    #receiptWrap { position: absolute; left: -9999px; top: 0; }
    .receipt { width: 380px; background: #fff; border: 3px solid var(--navy); border-radius: 14px; padding: 20px; color: var(--ink); font-family: 'Nunito', 'Noto Sans Sinhala', sans-serif; }
    .receipt-head { text-align: center; border-bottom: 2px dashed var(--navy); padding-bottom: 10px; margin-bottom: 14px; }
    .receipt-head img { width: 54px; height: 54px; border-radius: 50%; border: 2px solid var(--sun); }
    .receipt-head h2 { margin: 4px 0 0; color: var(--navy); font-size: 1.25rem; }
    .receipt-head p { margin: 0; font-weight: 700; color: var(--muted); font-size: .9rem; }
    .receipt-row { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 8px; font-size: .95rem; }
    .receipt-row strong { color: var(--navy); text-align: right; }
    .receipt-total { background: #e8f7ee; border: 1px dashed var(--green); border-radius: 10px; padding: 10px; text-align: center; margin-top: 14px; }
    .receipt-total h3 { margin: 0; color: var(--green); font-size: 1.3rem; }
    .receipt-foot { text-align: center; margin-top: 14px; font-size: .78rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 8px; }
  </style>
</head>
<body>
<div id="chrome"></div>

<main class="wrap narrow">
  <h2 class="ribbon">ගාස්තු ගෙවීම</h2>

  <section class="card" style="--accent: var(--orange)">
    <h3>ශිෂ්‍යයා සොයන්න</h3>
    <div id="scanner"></div>
    <div class="row" style="margin-top:14px">
      <div class="grow">
        <label class="label" for="stuId">ශිෂ්‍ය හැඳුනුම් අංකය</label>
        <input type="text" id="stuId" placeholder="ඇතුළත් කරන්න හෝ ස්කෑන් කරන්න (උදා: STU1001)" autocomplete="off">
      </div>
      <button type="button" class="btn" id="findBtn">සොයන්න</button>
    </div>
    <div id="stuBox"></div>
  </section>

  <section class="card" style="--accent: var(--green)">
    <h3>ගෙවීම සටහන් කරන්න</h3>
    <div id="dueBox"></div>
    <form id="feeForm">
      <div class="field">
        <label class="label" for="month">ගෙවන මාසය</label>
        <select id="month" required></select>
      </div>
      <div class="field">
        <label class="label" for="amount">ගෙවූ මුදල (රු.)</label>
        <input type="number" id="amount" min="1" step="any" inputmode="decimal" placeholder="උදා: 2000" required>
      </div>
      <button type="submit" class="btn green block" id="payBtn">ගෙවීම සටහන් කර රිසිට්පත සාදන්න</button>
    </form>
  </section>

  <div id="result"></div>
</main>

<!-- රිසිට්පත් ආකෘතිය -->
<div id="receiptWrap">
  <div class="receipt" id="receipt">
    <div class="receipt-head">
      <img src="logo.png" alt="">
      <h2>ENGLISH WITH SUDAN SIR</h2>
      <p>ගෙවීම් රිසිට්පත</p>
    </div>
    <div class="receipt-row"><span>දිනය සහ වේලාව</span><strong id="rDate"></strong></div>
    <div class="receipt-row"><span>රිසිට්පත් අංකය</span><strong id="rNo"></strong></div>
    <div class="receipt-row"><span>ශිෂ්‍ය අංකය</span><strong id="rId"></strong></div>
    <div class="receipt-row"><span>ශිෂ්‍යයාගේ නම</span><strong id="rName"></strong></div>
    <div class="receipt-row"><span>ශ්‍රේණිය</span><strong id="rGrade"></strong></div>
    <div class="receipt-row"><span>ගෙවූ මාසය</span><strong id="rMonth"></strong></div>
    <div class="receipt-total">
      <div style="font-size:.85rem;color:var(--muted)">ලැබුණු මුදල</div>
      <h3>රු. <span id="rAmount"></span></h3>
      <small style="color:var(--green);font-weight:800">ගෙවීම සාර්ථකයි</small>
    </div>
    <div class="receipt-foot">ස්තූතියි!<br>දුරකථන: <span id="rPhone"></span> | වට්ස්ඇප්: <span id="rWa"></span></div>
  </div>
</div>

<script>
  mountChrome();
  fillMonths($('month'), true);
  $('rPhone').textContent = CONFIG.contactPhone;
  $('rWa').textContent = CONFIG.contactWhatsapp;

  let cur = null, scanner = null, lastBlobUrl = null;

  /* ---------- ශිෂ්‍යයා සෙවීම + ගෙවිය යුතු මාස ---------- */
  function renderDue() {
    if (!cur) { $('dueBox').innerHTML = ''; return; }
    const { due, next } = feePlan(cur.data.fees || {});
    if (next) $('month').value = next;               // පැරණිතම ගෙවා නැති මාසය ස්වයංක්‍රීයව තෝරයි

    if (!due.length) {
      $('dueBox').innerHTML = `<div class="notice">මේ මාසය දක්වා සියලු ගාස්තු ගෙවා ඇත.${next ? ` ඉදිරියට ගෙවන්නේ නම් <strong>${MONTH_SI[next]}</strong> තෝරා ඇත.` : ''}</div>`;
      return;
    }
    const overdue = due.length > 1 || due[0] !== currentMonthKey();
    $('dueBox').innerHTML = `<div class="notice ${overdue ? 'warn' : ''}">
      ${overdue ? '<strong>පෙර මාසවල ගාස්තු ගෙවා නැත.</strong> ගෙවීමට ඇති මාස:' : 'ගෙවීමට ඇති මාසය:'}
      <div class="chips auto">${due.map(m => `<button type="button" class="chip sm${m === next ? ' on' : ''}" data-month="${m}">${MONTH_SI[m]}</button>`).join('')}</div>
      <div style="margin-top:8px">ගෙවීම සටහන් වන්නේ <strong>${MONTH_SI[next]}</strong> මාසයට ය (පැරණිතම ගෙවා නැති මාසය). වෙනත් මාසයක් සඳහා ඉහත මාසයක් තෝරන්න.</div>
    </div>`;
  }
  $('dueBox').addEventListener('click', e => {
    const b = e.target.closest('[data-month]');
    if (!b) return;
    $('month').value = b.dataset.month;
    $('dueBox').querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === b));
  });

  async function lookup() {
    const id = $('stuId').value.trim();
    if (!id) return toast('ශිෂ්‍ය අංකය ඇතුළත් කරන්න හෝ ස්කෑන් කරන්න.', 'bad');
    cur = await findStudent(id);
    renderStudentBox($('stuBox'), cur);
    renderDue();
    if (!cur) toast('එම අංකයට අදාළ ශිෂ්‍යයෙකු හමු නොවිණි.', 'bad');
  }
  $('findBtn').addEventListener('click', lookup);
  $('stuId').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); lookup(); } });

  scanner = mountScanner('scanner', { onScan: text => { $('stuId').value = text; lookup(); } });

  /* ---------- ගෙවීම සටහන් කිරීම ---------- */
  $('feeForm').addEventListener('submit', async e => {
    e.preventDefault();
    if (!cur) return toast('මුලින්ම ශිෂ්‍යයා සොයන්න.', 'bad');
    const month = $('month').value;
    const amount = parseFloat($('amount').value);
    if (!month) return toast('මාසය තෝරන්න.', 'bad');
    if (!(amount > 0)) return toast('නිවැරදි මුදලක් ඇතුළත් කරන්න.', 'bad');

    const btn = $('payBtn');
    btn.disabled = true;
    const s = cur.data, id = cur.key;
    const now = new Date();
    const date = localDate(now);
    const ym = date.slice(0, 7);
    const recNo = `REC-${date.replace(/-/g, '').slice(2)}-${Math.floor(1000 + Math.random() * 9000)}`;

    $('rDate').textContent = `${date} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
    $('rNo').textContent = recNo;
    $('rId').textContent = id;
    $('rName').textContent = s.name || id;
    $('rGrade').textContent = s.grade || '-';
    $('rMonth').textContent = MONTH_SI[month];
    $('rAmount').textContent = amount.toFixed(2);

    const record = { studentId: id, studentName: s.name || 'N/A', grade: s.grade || 'N/A', amount, month, date, timestamp: now.toISOString(), receiptNo: recNo };
    try {
      await db.ref('students/' + id).update({
        fee: 'Paid', status: 'Paid',
        ['fees/' + month]: 'Paid',
        lastPaymentMonth: month, lastPaymentAmount: amount, lastPaymentDate: date
      });
      await Promise.all([
        db.ref(`payments/${month}/${id}`).set(record),
        db.ref(`revenue/${ym}/transactions/${recNo}`).set(record),
        db.ref(`revenue/${ym}/totalAmount`).transaction(t => (t || 0) + amount)
      ]);
    } catch (err) {
      btn.disabled = false;
      return toast('ගෙවීම සටහන් කිරීම අසාර්ථකයි: ' + err.message, 'bad');
    }

    // රිසිට්පත රූපයක් බවට පත් කිරීම
    let blob = null;
    try {
      await document.fonts.ready;
      const canvas = await html2canvas($('receipt'), { scale: 3 });
      blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
    } catch { /* රූපය සෑදීම අසාර්ථක වුවද ගෙවීම සටහන් වී ඇත */ }

    let copied = false;
    if (blob) {
      try { await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]); copied = true; } catch {}
      if (lastBlobUrl) URL.revokeObjectURL(lastBlobUrl);
      lastBlobUrl = URL.createObjectURL(blob);
    }

    const msg = `🧾 *${CONFIG.brand}* - ගෙවීම් රිසිට්පත\nශිෂ්‍යයා: ${s.name} (${id})\nමාසය: ${MONTH_SI[month]}\nගෙවූ මුදල: රු. ${amount.toFixed(2)}\nරිසිට්පත් අංකය: ${recNo}\nස්තූතියි!`;
    const link = waLink(studentPhone(s), msg);
    $('result').innerHTML = `<div class="notice"><strong>${MONTH_SI[month]} මාසයේ ගෙවීම සටහන් විය.</strong>
      ${copied ? '<br>රිසිට්පත් රූපය පිටපත් විය. වට්ස්ඇප් සංවාදයේ අලවන්න.' : ''}<br>
      ${blob ? `<a class="btn navy" href="${lastBlobUrl}" download="Receipt_${esc(id)}_${month}.png">රිසිට්පත බාගන්න</a>` : ''}
      ${link ? `<a class="btn wa" href="${link}" target="_blank" rel="noopener">වට්ස්ඇප් යවන්න</a>` : '<br>දුරකථන අංකයක් සටහන් කර නැති නිසා වට්ස්ඇප් පණිවිඩය යැවිය නොහැක.'}
    </div>`;
    toast('ගෙවීම සටහන් විය.', 'ok');

    // ශිෂ්‍යයා තබාගෙන ඊළඟ ගෙවිය යුතු මාසය ස්වයංක්‍රීයව තෝරයි (ඉතිරි මාස ඒ අයුරින්ම ගෙවිය හැක)
    cur.data.fees = { ...(cur.data.fees || {}), [month]: 'Paid' };
    renderStudentBox($('stuBox'), cur);
    renderDue();
    btn.disabled = false;
  });
</script>
</body>
</html>
