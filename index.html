<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English with Sudan Sir - Attendance Management System</title>
    <!-- Firebase SDK (v8 Compatibility Layer) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 15px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* Header Layout */
        header {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            text-align: center;
        }

        .header-title h1 {
            font-size: 26px;
            color: #1e3a8a;
        }

        .header-title p {
            font-size: 14px;
            color: #6b7280;
        }

        /* Responsive Navigation Bar */
        .nav-bar {
            background: white;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: flex-start;
        }

        .nav-title {
            font-weight: bold;
            font-size: 16px;
            margin-right: auto;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn {
            padding: 10px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            color: #4b5563;
            background-color: #f3f4f6;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: none;
            cursor: pointer;
        }

        .nav-btn:hover {
            background-color: #e5e7eb;
            color: #111827;
        }

        .nav-btn.active {
            background-color: #2563eb;
            color: white;
        }

        /* Clickable Day Selection Bar */
        .day-selection-card {
            background: white;
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .day-selection-card h3 {
            font-size: 15px;
            color: #374151;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .day-btn {
            padding: 14px 10px;
            border: 2px solid #e5e7eb;
            background: #ffffff;
            color: #374151;
            border-radius: 8px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .day-btn:hover {
            border-color: #2563eb;
            color: #2563eb;
            background: #eff6ff;
        }

        .day-btn.selected {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
            box-shadow: 0 4px 8px rgba(37, 99, 235, 0.25);
        }

        /* Scanner Area */
        .scanner-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            text-align: center;
        }

        .scanner-box {
            max-width: 400px;
            height: 250px;
            border: 2px dashed #cbd5e1;
            border-radius: 10px;
            margin: 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
            color: #64748b;
        }

        /* Responsive Breakpoints */
        @media (max-width: 768px) {
            .nav-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .nav-title {
                margin-right: 0;
                margin-bottom: 8px;
                text-align: center;
            }

            .days-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="header-title">
            <h1>English with Sudan Sir</h1>
            <p>Student Attendance & Class Management System</p>
        </div>
    </header>

    <!-- Navigation Bar (Matched to Repo Files) -->
    <div class="nav-bar">
        <span class="nav-title">📸 Attendance Scanner</span>
        <a href="index.html" class="nav-btn active">📸 Scanner</a>
        <a href="register.html" class="nav-btn">+ New Register</a>
        <a href="fee.html" class="nav-btn">💳 Fee Payment</a>
        <a href="admin_fees.html" class="nav-btn">🗂️ Admin Panel</a>
        <a href="teacher_dashboard.html" class="nav-btn">📊 Dashboard</a>
    </div>

    <!-- Day Selection Option (Day 1 - Day 4 Only) -->
    <div class="day-selection-card">
        <h3>Select Class Session Day</h3>
        <div class="days-grid" id="daysContainer">
            <button class="day-btn selected" onclick="selectDay(this, 'Day 1')">Day 1</button>
            <button class="day-btn" onclick="selectDay(this, 'Day 2')">Day 2</button>
            <button class="day-btn" onclick="selectDay(this, 'Day 3')">Day 3</button>
            <button class="day-btn" onclick="selectDay(this, 'Day 4')">Day 4</button>
        </div>
    </div>

    <!-- Attendance Area -->
    <div class="scanner-card">
        <h2 id="activeDayDisplay">Active Session: Day 1</h2>
        <div class="scanner-box">
            <p>📷 QR Code Camera Stream Ready</p>
        </div>
    </div>
</div>

<script>
    // Day Selection Logic
    let activeSelectedDay = 'Day 1';

    function selectDay(element, dayName) {
        // Remove active class from all buttons
        const buttons = document.querySelectorAll('.day-btn');
        buttons.forEach(btn => btn.classList.remove('selected'));

        // Highlight selected button
        element.classList.add('selected');
        activeSelectedDay = dayName;

        // Update active UI title
        document.getElementById('activeDayDisplay').innerText = `Active Session: ${dayName}`;
    }
</script>

</body>
</html>
