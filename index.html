<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English with Sudan Sir - Attendance Scanner</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="logo.png">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #003366, #0080ff); margin: 0; padding: 20px; color: #333; min-height: 100vh; }
        .container { max-width: 450px; margin: auto; background: #fff; padding: 25px; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); text-align: center; }
        .logo { width: 110px; height: 110px; border-radius: 50%; object-fit: cover; }
        #reader { width: 100%; border-radius: 12px; overflow: hidden; margin: 15px 0; border: 2px solid #003366; }
        #result { font-weight: bold; font-size: 1em; margin-top: 15px; }
        
        .whatsapp-btn {
            background-color: #25D366;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            margin-top: 10px;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3);
            transition: 0.2s;
        }
        .whatsapp-btn:hover { background-color: #1ebc57; }

        .nav-links { display: flex; flex-direction: column; gap: 8px; margin-top: 20px; }
        .nav-links a { text-decoration: none; background: #f0f4f8; padding: 10px; border-radius: 8px; color: #003366; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <img src="logo.png" alt="Logo" class="logo">
    <h2 style="color: #003366; margin: 10px 0 5px 0;">English with Sudan Sir</h2>
    <p style="color: #666; font-size: 0.9em; margin-bottom: 15px;">QR Scanner - Attendance System</p>

    <div id="reader"></div>
    <div id="result"></div>

    <div class="nav-links">
        <a href="register.html">📝 නව ශිෂ්‍ය ලියාපදිංචිය</a>
        <a href="admin_fees.html">🛠️ Admin Panel (Attendance & Fees)</a>
        <a href="students_list.html">👥 සියලුම ශිෂ්‍යයන්ගේ ලැයිස්තුව</a>
        <a href="parent_portal.html">👨‍👩‍👧‍👦 Parent Portal</a>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAP97Utjqx54gmf9YaMsgWSK96TGTUCuSg",
        authDomain: "class-management-system-8c1a1.firebaseapp.com",
        databaseURL: "https://class-management-system-8c1a1-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "class-management-system-8c1a1",
        storageBucket: "class-management-system-8c1a1.firebasestorage.app",
        messagingSenderId: "759521896885",
        appId: "1:759521896885:web:ab834180d9ab45968791fc",
        measurementId: "G-XZW2VLFXT2"
    };
    firebase.initializeApp(firebaseConfig);

    function onScanSuccess(decodedText) {
        const date = new Date().toISOString().split('T')[0];
        const time = new Date().toLocaleTimeString();
        const res = document.getElementById('result');
        
        // 1. Firebase එකෙන් ශිෂ්‍යයාගේ විස්තර ලබා ගැනීම
        firebase.database().ref('students/' + decodedText).once('value', (snapshot) => {
            if(snapshot.exists()) {
                const student = snapshot.val();
                let phone = student.phone ? student.phone.trim() : "";
                const name = student.name || decodedText;

                // Phone number Format සැකසීම (077XXXXXXX ➔ 9477XXXXXXX)
                if (phone.startsWith("0")) {
                    phone = "94" + phone.substring(1);
                }

                // 2. පැමිණීම Database එකට Save කිරීම
                firebase.database().ref('attendance/' + date + '/' + decodedText).set({
                    time: time,
                    status: "Present"
                }).then(() => {
                    // WhatsApp Message එක පිළියෙල කිරීම
                    const msg = `Dear Parent, Your child *${name}* (${decodedText}) has safely arrived at *English with Sudan Sir* class today (${date}) at ${time}.`;
                    const whatsappUrl = `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`;

                    // UI එක යාවත්කාලීන කිරීම
                    res.innerHTML = `
                        <div style="background:#d4edda; color:#155724; padding:15px; border-radius:10px; border:1px solid #c3e6cb;">
                            ✅ <strong>${name}</strong> පැමිණීම සටහන් විය!<br><br>
                            <a href="${whatsappUrl}" target="_blank" class="whatsapp-btn">
                                📲 WhatsApp පණිවිඩය යවන්න
                            </a>
                        </div>
                    `;
                });
            } else {
                res.innerHTML = `
                    <div style="background:#f8d7da; color:#721c24; padding:12px; border-radius:8px;">
                        ❌ <strong>${decodedText}</strong> - මෙවැනි ශිෂ්‍යයෙකු නොමැත!
                    </div>
                `;
            }
        });
    }

    let html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
    html5QrcodeScanner.render(onScanSuccess);
</script>
</body>
</html>
