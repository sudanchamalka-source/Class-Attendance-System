<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Attendance Scanner - English with Sudan Sir</title>
    <link rel="icon" type="image/png" href="logo.png">
    
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 450px; width: 100%; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        h2 { color: #003366; margin-top: 0; }
        select, button { width: 100%; padding: 10px; margin: 8px 0; border-radius: 6px; border: 1px solid #ccc; font-size: 1em; }
        #reader { width: 100%; border-radius: 8px; overflow: hidden; margin-top: 10px; }
        .nav-links { margin-top: 15px; }
        .nav-links a { text-decoration: none; color: #0056b3; font-weight: bold; margin: 0 10px; }
        .result-box { margin-top: 15px; padding: 10px; border-radius: 8px; background: #e2e8f0; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>📸 Attendance QR Scanner</h2>

    <label for="daySelect"><strong>දිනය තෝරන්න (Select Day):</strong></label>
    <select id="daySelect">
        <option value="Day 1">Day 1</option>
        <option value="Day 2">Day 2</option>
        <option value="Day 3">Day 3</option>
        <option value="Day 4">Day 4</option>
    </select>

    <div id="reader"></div>

    <div class="result-box" id="result">QR එක Scan කරන්න...</div>

    <div class="nav-links">
        <a href="register.html">+ New Register</a> | 
        <a href="students.html">📚 Admin Panel</a>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAP97Utjqx54gmf9YaMsgWSK96TGTUCuSg",
        authDomain: "class-management-system-8c1a1.firebaseapp.com",
        databaseURL: "https://class-management-system-8c1a1-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "class-management-system-8c1a1",
        storageBucket: "class-management-system-8c1a1.firebasestorage.app",
        messagingSenderId: "759521896885",
        appId: "1:759521896885:web:ab834180d9ab45968791fc",
        measurementId: "G-XZW2VLFXT2"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let lastScannedId = "";

    function onScanSuccess(decodedText) {
        const studentId = decodedText.trim();
        const selectedDay = document.getElementById('daySelect').value;

        if (studentId === lastScannedId) return;
        lastScannedId = studentId;

        document.getElementById('result').innerText = `Scanned ID: ${studentId}...`;

        db.ref('students/' + studentId).once('value', (snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.val();
                
                // Attendance data update under the specific day
                const updateData = {};
                updateData[`attendance/${selectedDay}`] = true;
                updateData[`lastDate`] = new Date().toISOString().split('T')[0];

                db.ref('students/' + studentId).update(updateData).then(() => {
                    document.getElementById('result').innerText = `✅ ${data.name} - ${selectedDay} Attendance Marked!`;
                    setTimeout(() => { lastScannedId = ""; }, 3000);
                });
            } else {
                document.getElementById('result').innerText = `❌ ID ${studentId} හමු නොවීය!`;
                setTimeout(() => { lastScannedId = ""; }, 3000);
            }
        });
    }

    const html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
    html5QrcodeScanner.render(onScanSuccess);
</script>
</body>
</html>
