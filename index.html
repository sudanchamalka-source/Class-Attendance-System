<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Attendance Scanner</title>
    <link rel="icon" type="image/png" href="logo.png">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f4f8;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            box-sizing: border-box;
            text-align: center;
        }

        h2 { color: #003366; margin-top: 0; }

        .nav-links { margin-bottom: 20px; font-size: 0.9em; }
        .nav-links a { text-decoration: none; color: #0056b3; font-weight: bold; margin: 0 8px; }

        .day-selection-box {
            background: #e9ecef;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 2px solid #0056b3;
        }

        .day-selection-box label { font-weight: bold; color: #003366; display: block; margin-bottom: 8px; }
        .day-buttons { display: flex; gap: 8px; justify-content: center; }

        .day-btn {
            flex: 1;
            padding: 10px 0;
            border: 2px solid #0056b3;
            background: white;
            color: #0056b3;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        .day-btn.active { background: #0056b3; color: white; }

        #reader { width: 100%; border-radius: 10px; border: 2px solid #0056b3; margin-bottom: 15px; overflow: hidden; }

        .manual-input { display: flex; gap: 10px; margin-top: 15px; }
        .manual-input input { flex: 1; padding: 10px; border: 1px solid #0056b3; border-radius: 6px; }

        .btn-mark { background: #28a745; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }

        .status-box { margin-top: 20px; padding: 15px; border-radius: 8px; display: none; }
        .status-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .status-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .student-preview-img { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; border: 2px solid #155724; margin-bottom: 8px; }

        .btn-wa {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 16px;
            background-color: #25D366;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>📸 Attendance Scanner</h2>
        
        <div class="nav-links">
            <a href="index.html">📸 Scanner</a> | 
            <a href="register.html">+ New Register</a> | 
            <a href="fee.html">💳 Fee Payment</a> | 
            <a href="students_list.html">📚 Admin Panel</a>
        </div>

        <div class="day-selection-box">
            <label>📅 Select Class Session / Day:</label>
            <div class="day-buttons">
                <button type="button" class="day-btn active" onclick="selectDay('Day 1', this)">Day 1</button>
                <button type="button" class="day-btn" onclick="selectDay('Day 2', this)">Day 2</button>
                <button type="button" class="day-btn" onclick="selectDay('Day 3', this)">Day 3</button>
                <button type="button" class="day-btn" onclick="selectDay('Day 4', this)">Day 4</button>
            </div>
        </div>

        <div id="reader"></div>

        <div class="manual-input">
            <input type="text" id="manualId" placeholder="Enter Student ID manually...">
            <button type="button" class="btn-mark" onclick="markManualAttendance()">Mark</button>
        </div>

        <div id="statusBox" class="status-box"></div>
    </div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAP97Utjqx54gmf9YaMsgWSK96TGTUCuSg",
        authDomain: "class-management-system-8c1a1.firebaseapp.com",
        databaseURL: "https://class-management-system-8c1a1-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "class-management-system-8c1a1",
        storageBucket: "class-management-system-8c1a1.firebasestorage.app",
        messagingSenderId: "759521896885",
        appId: "1:759521896885:web:ab834180d9ab45968791fc",
        measurementId: "G-XZW2VLFXT2"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let selectedDay = 'Day 1';
    let isProcessing = false;

    function selectDay(dayName, element) {
        selectedDay = dayName;
        document.querySelectorAll('.day-btn').forEach(btn => btn.classList.remove('active'));
        element.classList.add('active');
        showStatus(`Selected: <strong>${selectedDay}</strong> for scans.`, 'success');
    }

    function processScan(studentId) {
        if (isProcessing) return;
        isProcessing = true;

        const cleanId = studentId.trim();
        if (!cleanId) {
            showStatus('⚠️ Invalid ID Scanned!', 'error');
            isProcessing = false;
            return;
        }

        db.ref('students/' + cleanId).once('value', (snapshot) => {
            if (!snapshot.exists()) {
                showStatus(`❌ Student ID <strong>${cleanId}</strong> not found!`, 'error');
                setTimeout(() => { isProcessing = false; }, 2000);
                return;
            }

            const student = snapshot.val();
            const now = new Date();
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const dateStr = now.toISOString().split('T')[0];

            const attendanceData = {
                stuId: cleanId,
                name: student.name || 'Unknown',
                grade: student.grade || 'N/A',
                day: selectedDay,
                date: dateStr,
                time: timeStr,
                timestamp: now.getTime()
            };

            // Save under both attendance/logs and students nodes
            db.ref(`attendance/${selectedDay}/${cleanId}`).set(attendanceData).then(() => {
                db.ref(`students/${cleanId}/attendance/${selectedDay}`).set(attendanceData);
                db.ref(`students/${cleanId}/lastAttendance`).set(attendanceData);

                // Prepare WhatsApp Notification Link
                let rawPhone = student.phone || student.whatsapp || '';
                let phoneNum = rawPhone.replace(/\D/g, '');
                if (phoneNum.startsWith('0')) {
                    phoneNum = '94' + phoneNum.substring(1);
                }

                const msg = `Dear Parent, ${student.name} (${cleanId}) has attended English with Sudan Sir class on ${dateStr} at ${timeStr} (${selectedDay}).`;
                const waUrl = `https://wa.me/${phoneNum}?text=${encodeURIComponent(msg)}`;

                // Auto Open WhatsApp tab
                if (phoneNum) {
                    window.open(waUrl, '_blank');
                }

                const photoSrc = student.photo || student.photoUrl || 'logo.png';
                showStatus(`
                    <img src="${photoSrc}" class="student-preview-img"><br>
                    ✅ <strong>${student.name}</strong> (${cleanId})<br>
                    Attendance Recorded for <strong>${selectedDay}</strong><br>
                    <small>Time: ${timeStr}</small><br>
                    ${phoneNum ? `<a href="${waUrl}" target="_blank" class="btn-wa">💬 Send WhatsApp Message</a>` : ''}
                `, 'success');

                setTimeout(() => { isProcessing = false; }, 2500);
            }).catch(err => {
                showStatus(`❌ Error: ${err.message}`, 'error');
                setTimeout(() => { isProcessing = false; }, 2000);
            });
        });
    }

    function markManualAttendance() {
        const input = document.getElementById('manualId');
        if (input.value) {
            processScan(input.value);
            input.value = '';
        } else {
            showStatus('⚠️ Please enter a Student ID.', 'error');
        }
    }

    function showStatus(htmlContent, type) {
        const statusBox = document.getElementById('statusBox');
        statusBox.innerHTML = htmlContent;
        statusBox.className = 'status-box ' + (type === 'success' ? 'status-success' : 'status-error');
        statusBox.style.display = 'block';
    }

    const html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: { width: 220, height: 220 } }, false);
    html5QrcodeScanner.render((decodedText) => processScan(decodedText));
</script>
</body>
</html>
