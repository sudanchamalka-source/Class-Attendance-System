<body>

<div class="container">
    <h2>QR Attendance & Fee System</h2>
    <div id="reader"></div>
    <p id="result">QR කේතය Scan කිරීමට Camera එක පෙන්වන්න</p>

    <div class="nav-links">
        <a href="register.html">ලියාපදිංචිය</a>
        <a href="qr_generator.html">QR Generator</a>
        <a href="admin_fees.html">Admin Panel</a>
    </div>
</div>

<script>
    // Firebase Configuration - මෙතැනට ඔබගේ Firebase Config එක යොදන්න
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
        databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT_ID.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    function onScanSuccess(decodedText, decodedResult) {
        document.getElementById('result').innerText = "Scan කළ අංකය: " + decodedText;
        markAttendance(decodedText);
    }

    function markAttendance(studentId) {
        const date = new Date().toISOString().split('T')[0];
        const time = new Date().toLocaleTimeString();

        database.ref('attendance/' + date + '/' + studentId).set({
            time: time,
            status: "Present"
        }).then(() => {
            alert("පැමිණීම සටහන් විය!");
            sendWhatsAppMsg(studentId, date, time);
        }).catch((error) => {
            alert("දෝෂයක් සිදු විය: " + error.message);
        });
    }

    function sendWhatsAppMsg(studentId, date, time) {
        database.ref('students/' + studentId).once('value').then((snapshot) => {
            const student = snapshot.val();
            if (student && student.phone) {
                const statusText = student.feeStatus === "Paid" ? "ගෙවා ඇත ✅" : "ගෙවීමට ඇත ⚠️";
                const message = encodeURIComponent(
                    `*පන්ති පැමිණීමේ සටහන*

` +
                    `නම: ${student.name}
` +
                    `දිනය: ${date}
` +
                    `වේලාව: ${time}
` +
                    `පන්ති ගාස්තු: ${statusText}

` +
                    `ස්තූතියි!`
                );
                const url = `https://wa.me/${student.phone}?text=${message}`;
                window.open(url, '_blank');
            } else {
                alert("මෙම ID එකට අදාළ ශිෂ්‍යයෙකු සොයාගත නොහැකි විය!");
            }
        });
    }

    let html5QrcodeScanner = new Html5QrcodeScanner(
        "reader", { fps: 10, qrbox: 250 });
    html5QrcodeScanner.render(onScanSuccess);
</script>

</body>
