<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>පැමිණීම් සටහන - English with Sudan Sir</title>
  <meta name="theme-color" content="#14246b">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="shared.css">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="shared.js"></script>
</head>
<body>
<div id="chrome"></div>

<main class="wrap">
  <h2 class="ribbon">පැමිණීම් සටහන</h2>

  <section class="card" style="--accent: var(--blue)">
    <h3>පන්ති දිනය තෝරන්න</h3>
    <div class="chips" id="days"></div>
  </section>

  <div class="stats">
    <div class="stat"><b id="statTotal">0</b><span>මුළු ශිෂ්‍යයන්</span></div>
    <div class="stat"><b id="statPresent">0</b><span>පැමිණි</span></div>
    <div class="stat"><b id="statAbsent">0</b><span>නොපැමිණි</span></div>
  </div>

  <section class="card">
    <div class="row between">
      <h3 id="listTitle">1 වන දිනයේ පැමිණීම</h3>
      <div class="field" style="margin:0; flex:1 1 240px; max-width:320px">
        <input type="search" id="q" placeholder="නමෙන් හෝ අංකයෙන් සොයන්න" aria-label="ශිෂ්‍යයෙකු සොයන්න">
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>ශිෂ්‍ය අංකය</th><th>නම</th><th>ශ්‍රේණිය</th><th>තත්ත්වය</th></tr></thead>
        <tbody id="rows"><tr><td colspan="4" class="empty">දත්ත පූරණය වෙමින් පවතී…</td></tr></tbody>
      </table>
    </div>
  </section>
</main>

<script>
  mountChrome();

  let students = [];      // Firebase එකෙන් එක් වරක් පමණක් කියවා මතකයේ තබාගනී
  let activeDay = DAYS[0];

  // දින බොත්තම් (HTML හතර වරක් ලිවීම වෙනුවට එක් වරක් නිර්මාණය කරයි)
  $('days').innerHTML = DAYS.map((d, i) =>
    `<button type="button" class="chip${i === 0 ? ' on' : ''}" data-day="${d}">${DAY_SI[d]}</button>`).join('');
  $('days').addEventListener('click', e => {
    const btn = e.target.closest('.chip');
    if (!btn) return;
    document.querySelectorAll('#days .chip').forEach(c => c.classList.toggle('on', c === btn));
    activeDay = btn.dataset.day;
    render();
  });
  $('q').addEventListener('input', render);

  // එකම listener එකක් - දිනය මාරු කරන විට නැවත Firebase listener එකතු නොවේ
  db.ref('students').on('value', snap => {
    students = [];
    snap.forEach(c => students.push({ key: c.key, ...c.val() }));
    render();
  }, err => {
    $('rows').innerHTML = `<tr><td colspan="4" class="empty">දත්ත කියවීමට නොහැකි විය: ${esc(err.message)}</td></tr>`;
  });

  function render() {
    const term = $('q').value.trim().toLowerCase();
    const isPresent = s => s.attendance && s.attendance[activeDay] === true;
    const present = students.filter(isPresent).length;

    $('statTotal').textContent = students.length;
    $('statPresent').textContent = present;
    $('statAbsent').textContent = students.length - present;
    $('listTitle').textContent = `${DAY_SI[activeDay]} පැමිණීම`;

    const list = students.filter(s =>
      !term || s.key.toLowerCase().includes(term) || String(s.name || '').toLowerCase().includes(term));

    $('rows').innerHTML = list.length ? list.map(s => `
      <tr>
        <td><strong>${esc(s.key)}</strong></td>
        <td>${esc(s.name || '-')}</td>
        <td>${esc(s.grade || '-')}</td>
        <td><span class="badge ${isPresent(s) ? 'ok' : 'bad'}">${isPresent(s) ? 'පැමිණ ඇත' : 'නොපැමිණේ'}</span></td>
      </tr>`).join('')
      : `<tr><td colspan="4" class="empty">${students.length ? 'සෙවුමට ගැළපෙන ශිෂ්‍යයෙකු නැත.' : 'ශිෂ්‍යයන් තවම ලියාපදිංචි කර නැත.'}</td></tr>`;
  }
</script>
</body>
</html>
