<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Attendance & Student Details</title>
    <link rel="icon" type="image/png" href="logo.png">
    
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 480px; width: 100%; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        h2 { color: #003366; margin-top: 0; }
        
        .input-group { display: flex; gap: 8px; margin-bottom: 12px; }
        input[type="text"], select, button { padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 1em; }
        input[type="text"] { flex: 1; }
        
        .btn-main { background: #003366; color: white; border: none; font-weight: bold; cursor: pointer; }
        .btn-wa { background: #25D366; color: white; border: none; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; display: none; text-decoration: none; padding: 12px; border-radius: 6px; box-sizing: border-box; }
        
        #reader { width: 100%; border-radius: 8px; overflow: hidden; margin-top: 10px; }
        
        /* Student Details Box */
        .student-card { display: none; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 10px; padding: 15px; margin-top: 15px; text-align: left; }
        .student-card img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; display: block; margin: 0 auto 10px auto; border: 2px solid #003366; }
        .student-info p { margin: 6px 0; font-size: 0.95em; color: #334155; }
        .student-info strong { color: #0f172a; }
        .fee-paid { color: #16a34a; font-weight: bold; }
        .fee-notpaid { color: #dc2626; font-weight: bold; }
        
        .nav-links { margin-top: 20px; }
        .nav-links a { text-decoration: none; color: #0056b3; font-weight: bold; margin: 0 10px; }
        .status-msg { margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>📸 Attendance & Details</h2>

    <!-- Manual ID Input -->
    <div class="input-group">
        <input type="text" id="manualIdInput" placeholder="Enter Student ID (e.g. STU101)">
        <button class="btn-main" onclick="searchStudentById()">Search</button>
    </div>

    <!-- Day Select Dropdown -->
    <div style="text-align: left; margin-bottom: 8px;">
        <label for="daySelect"><strong>තෝරාගත් දිනය (Day):</strong></label>
    </div>
    <select id="daySelect" style="width: 100%;">
        <option value="Day 1">Day 1</option>
        <option value="Day 2">Day 2</option>
        <option value="Day 3">Day 3</option>
        <option value="Day 4">Day 4</option>
    </select>

    <!-- QR Camera Reader -->
    <div id="reader"></div>

    <!-- Student Info Display Area -->
    <div class="student-card" id="studentCard">
        <img id="stuPhoto" src="logo.png" alt="Student Photo">
        <div class="student-info">
            <p><strong>ID:</strong> <span id="stuId"></span></p>
            <p><strong>Name:</strong> <span id="stuName"></span></p>
            <p><strong>Grade:</strong> <span id="stuGrade"></span></p>
            <p><strong>Phone:</strong> <span id="stuPhone"></span></p>
            <p><strong>Fee Status:</strong> <span id="stuFee"></span></p>
        </div>
        
        <button class="btn-main" style="width: 100%; margin-top: 10px;" onclick="markAttendance()">✅ Mark Attendance</button>
        <a id="waBtn" class="btn-wa" target="_blank">📲 Send WhatsApp Confirmation</a>
    </div>

    <div class="status-msg" id="statusMsg"></div>

    <div class="nav-links">
        <a href="register.html">+ New Register</a> | 
        <a href="students_list.html">📚 Admin Panel</a>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAP97Utjqx54gmf9YaMsgWSK96TGTUCuSg",
        authDomain: "class-management-system-8c1a1.firebaseapp.com",
        databaseURL: "https://class-management-system-8c1a1-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "class-management-system-8c1a1",
        storageBucket: "class-management-system-8c1a1.firebasestorage.app",
        messagingSenderId: "759521896885",
        appId: "1:759521896885:web:ab834180d9ab45968791fc",
        measurementId: "G-XZW2VLFXT2"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentStudent = null;

    // Scan through QR Camera
    function onScanSuccess(decodedText) {
        const studentId = decodedText.trim();
        loadStudentDetails(studentId);
    }

    // Search via Manual Input
    function searchStudentById() {
        const studentId = document.getElementById('manualIdInput').value.trim();
        if (studentId) {
            loadStudentDetails(studentId);
        } else {
            alert('කරුණාකර Student ID එක ඇතුළත් කරන්න!');
        }
    }

    // Fetch Student Details from Firebase
    function loadStudentDetails(studentId) {
        document.getElementById('statusMsg').innerText = "විස්තර ලබාගනිමින් පවතියි...";
        
        db.ref('students/' + studentId).once('value', (snapshot) => {
            if (snapshot.exists()) {
                currentStudent = snapshot.val();
                currentStudent.id = studentId;

                // Render Details
                document.getElementById('stuPhoto').src = currentStudent.photo || 'logo.png';
                document.getElementById('stuId').innerText = studentId;
                document.getElementById('stuName').innerText = currentStudent.name || '-';
                document.getElementById('stuGrade').innerText = currentStudent.grade || '-';
                document.getElementById('stuPhone').innerText = currentStudent.phone || '-';
                
                const feeEl = document.getElementById('stuFee');
                feeEl.innerText = currentStudent.fee || 'Not Paid';
                feeEl.className = (currentStudent.fee && currentStudent.fee.toLowerCase().includes('paid')) ? 'fee-paid' : 'fee-notpaid';

                // Display Card
                document.getElementById('studentCard').style.display = 'block';
                document.getElementById('waBtn').style.display = 'none'; // Hide until marked
                document.getElementById('statusMsg').innerText = "ශිෂ්‍යයා සොයා ගන්නා ලදී. Attendance Mark කරන්න.";
            } else {
                document.getElementById('studentCard').style.display = 'none';
                document.getElementById('statusMsg').innerText = `❌ ID ${studentId} හි ශිෂ්‍යයෙකු හමු නොවීය!`;
            }
        });
    }

    // Mark Attendance in Firebase & Prepare WhatsApp Link
    function markAttendance() {
        if (!currentStudent) return;

        const selectedDay = document.getElementById('daySelect').value;
        const updateData = {};
        updateData[`attendance/${selectedDay}`] = true;
        updateData[`lastDate`] = new Date().toISOString().split('T')[0];

        db.ref('students/' + currentStudent.id).update(updateData).then(() => {
            document.getElementById('statusMsg').innerText = `✅ ${currentStudent.name} සඳහා ${selectedDay} Attendance සටහන් විය!`;

            // Prepare WhatsApp Message Link
            let phone = currentStudent.phone ? currentStudent.phone.replace(/[^0-9]/g, '') : '';
            if (phone.startsWith('0')) {
                phone = '94' + phone.substring(1); // Convert 07X to 947X for LK
            }

            const msg = `Dear Parent/Student,\n\nAttendance Marked! 📌\nStudent Name: ${currentStudent.name}\nID: ${currentStudent.id}\nClass Day: ${selectedDay}\nDate: ${new Date().toLocaleDateString()}\n\nThank you!\nEnglish with Sudan Sir`;
            
            const waUrl = `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`;
            
            const waBtn = document.getElementById('waBtn');
            waBtn.href = waUrl;
            waBtn.style.display = 'block';
        });
    }

    // Camera Scanner Initialization
    const html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 220 });
    html5QrcodeScanner.render(onScanSuccess);
</script>
</body>
</html>
