<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>පන්ති පැමිණීම සහ ගාස්තු කළමනාකරණය</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; margin: 0; padding: 20px; background-color: #f8f9fa; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; }
        #reader { width: 100%; max-width: 320px; margin: 20px auto; border-radius: 8px; overflow: hidden; }
        #result { font-weight: bold; font-size: 1.1em; color: #007bff; margin-top: 15px; }
        .nav-links { margin-top: 25px; padding-top: 15px; border-top: 1px solid #eee; display: flex; justify-content: space-around; }
        .nav-links a { text-decoration: none; color: #495057; font-weight: 600; font-size: 0.9em; }
        .nav-links a:hover { color: #007bff; }
    </style>
</head>
<body>

<div class="container">
    <h2>QR Attendance & Fee System</h2>
    <div id="reader"></div>
    <p id="result">QR කේතය Scan කිරීමට Camera එක පෙන්වන්න</p>

    <div class="nav-links">
        <a href="register.html">ලියාපදිංචිය</a>
        <a href="qr_generator.html">QR Generator</a>
        <a href="admin_fees.html">Admin Panel</a>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
    import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAP97Utjqx54gmf9YaMsgWSK96TGTUCuSg",
        authDomain: "class-management-system-8c1a1.firebaseapp.com",
        projectId: "class-management-system-8c1a1",
        storageBucket: "class-management-system-8c1a1.firebasestorage.app",
        messagingSenderId: "759521896885",
        appId: "1:759521896885:web:ab834180d9ab45968791fc",
        measurementId: "G-XZW2VLFXT2"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    function onScanSuccess(decodedText) {
        document.getElementById('result').innerText = "Scan කළ අංකය: " + decodedText;
        markAttendance(decodedText);
    }

    async function markAttendance(studentId) {
        const date = new Date().toISOString().split('T')[0];
        const month = date.slice(0, 7);
        const time = new Date().toLocaleTimeString();

        try {
            await set(ref(database, 'attendance/' + date + '/' + studentId), {
                time: time,
                status: "Present"
            });
            alert("පැමිණීම සටහන් විය!");
            sendWhatsAppMsg(studentId, date, month, time);
        } catch (error) {
            alert("දෝෂයක් සිදු විය: " + error.message);
        }
    }

    async function sendWhatsAppMsg(studentId, date, month, time) {
        const dbRef = ref(database);
        try {
            const snapshot = await get(child(dbRef, `students/${studentId}`));
            if (snapshot.exists()) {
                const student = snapshot.val();
                if (student.phone) {
                    const monthFee = (student.fees && student.fees[month]) ? student.fees[month] : "Pending";
                    const statusText = monthFee === "Paid" ? "ගෙවා ඇත ✅" : "ගෙවීමට ඇත ⚠️";
                    
                    const message = encodeURIComponent(
                        `*පන්ති පැමිණීමේ සටහන*

` +
                        `නම: ${student.name}
` +
                        `දිනය: ${date}
` +
                        `වේලාව: ${time}
` +
                        `${month} මාසයේ ගාස්තු: ${statusText}

` +
                        `ස්තූතියි!`
                    );
                    const url = `https://wa.me/${student.phone}?text=${message}`;
                    window.open(url, '_blank');
                }
            } else {
                alert("මෙම ID එකට අදාළ ශිෂ්‍යයෙකු සොයාගත නොහැකි විය!");
            }
        } catch (error) {
            alert("දෝෂයක් සිදු විය: " + error.message);
        }
    }

    let html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
    html5QrcodeScanner.render(onScanSuccess);
</script>

</body>
</html>
