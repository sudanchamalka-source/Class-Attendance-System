<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Attendance & QR Scanner</title>
    <link rel="icon" type="image/png" href="logo.png">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <!-- Html5-QRCode Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f4f8;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }

        h2 { text-align: center; color: #003366; margin-top: 0; }

        .nav-links {
            text-align: center;
            margin-bottom: 20px;
            font-size: 0.9em;
        }

        .nav-links a {
            text-decoration: none;
            color: #0056b3;
            font-weight: bold;
            margin: 0 8px;
        }

        .btn-qr-toggle {
            width: 100%;
            background: #0056b3;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1em;
            margin-bottom: 15px;
        }

        .btn-qr-toggle:hover { background: #003366; }

        #qr-reader-container {
            display: none;
            margin-bottom: 15px;
            border: 2px solid #0056b3;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }

        #reader {
            width: 100%;
            min-height: 250px;
        }

        .upload-section {
            background: #e9ecef;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            border: 1px dashed #0056b3;
        }

        .upload-section label {
            font-weight: bold;
            color: #003366;
            display: block;
            margin-bottom: 5px;
            font-size: 0.9em;
        }

        .form-group { margin-bottom: 15px; }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #0056b3;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1em;
        }

        .search-btn {
            background: #003366;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 10px 15px;
            cursor: pointer;
            font-weight: bold;
        }

        .student-details-card {
            background: #e8f4f8;
            border-left: 4px solid #0056b3;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: none;
        }

        .student-details-card p { margin: 6px 0; font-size: 0.95em; color: #333; }
        .student-details-card span { font-weight: bold; color: #003366; }

        .phone-highlight {
            background: #25D366;
            color: white !important;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.9em;
        }

        .btn-submit {
            width: 100%;
            background: #28a745;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-submit:hover { background: #218838; }
    </style>
</head>
<body>

    <div class="container">
        <h2>📸 Attendance & QR Scanner</h2>
        
        <div class="nav-links">
            <a href="index.html">📸 Scanner</a> | 
            <a href="register.html">+ New Register</a> | 
            <a href="fee.html">💳 Fee Payment</a> | 
            <a href="students_list.html">📚 Admin Panel</a>
        </div>

        <!-- Camera Scanner Toggle Button -->
        <button type="button" class="btn-qr-toggle" onclick="toggleScanner()">
            📷 <span id="scannerToggleText">Open Camera QR Scanner</span>
        </button>

        <div id="qr-reader-container">
            <div id="reader"></div>
        </div>

        <!-- File Upload Camera Backup -->
        <div class="upload-section">
            <label for="qrFile">📁 Camera Blocked? Upload QR Image File:</label>
            <input type="file" id="qrFile" accept="image/*" onchange="uploadScanQr(event)">
        </div>

        <!-- Student Lookup Form -->
        <div class="form-group">
            <label for="studentId">Student ID / Index No:</label>
            <div style="display: flex; gap: 8px;">
                <input type="text" id="studentId" placeholder="Enter or Scan ID (e.g. STU1001)" required>
                <button type="button" class="search-btn" style="width: 80px;" onclick="loadStudentDetails()">Lookup</button>
            </div>
        </div>

        <!-- Student Details Information Display Card -->
        <div id="studentCard" class="student-details-card">
            <p><strong>Name:</strong> <span id="lblStudentName">-</span></p>
            <p><strong>Grade:</strong> <span id="lblGrade">-</span></p>
            <p><strong>WhatsApp / Phone:</strong> <span id="lblPhone" class="phone-highlight">-</span></p>
            <p><strong>Fee Status:</strong> <span id="lblStatus">-</span></p>
        </div>

        <!-- Attendance Action Button -->
        <button type="button" class="btn-submit" onclick="markAttendance()">✅ Mark Attendance</button>
    </div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAP97Utjqx54gmf9YaMsgWSK96TGTUCuSg",
        authDomain: "class-management-system-8c1a1.firebaseapp.com",
        databaseURL: "https://class-management-system-8c1a1-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "class-management-system-8c1a1",
        storageBucket: "class-management-system-8c1a1.firebasestorage.app",
        messagingSenderId: "759521896885",
        appId: "1:759521896885:web:ab834180d9ab45968791fc",
        measurementId: "G-XZW2VLFXT2"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let html5QrCode = null;
    let isScannerOpen = false;
    let loadedStudent = null;

    // Verify context protocol before accessing camera APIs
    function checkBrowserSecurityContext() {
        if (window.location.protocol === 'file:') {
            alert("❌ SECURITY ERROR: You opened this file directly from your computer (file:///).\n\nBrowsers PERMANENTLY block camera permissions on local file paths. Run this page using VS Code Live Server (http://localhost:5500) or deploy to GitHub Pages (HTTPS)!");
            return false;
        }
        if (window.location.protocol === 'http:' && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
            alert("❌ SECURITY ERROR: Your site is using plain HTTP.\n\nBrowsers block camera access unless the URL starts with https:// or http://localhost.");
            return false;
        }
        return true;
    }

    // Toggle Camera Scanner safely
    async function toggleScanner() {
        const container = document.getElementById('qr-reader-container');
        const toggleText = document.getElementById('scannerToggleText');

        if (!isScannerOpen) {
            if (!checkBrowserSecurityContext()) return;

            container.style.display = 'block';
            toggleText.innerText = 'Close Camera Scanner';
            isScannerOpen = true;

            try {
                const devices = await Html5Qrcode.getCameras();
                
                if (devices && devices.length > 0) {
                    // Prioritize back camera for smartphones
                    const backCam = devices.find(d => d.label.toLowerCase().includes('back') || d.label.toLowerCase().includes('environment'));
                    const selectedCamId = backCam ? backCam.id : devices[0].id;

                    if (!html5QrCode) {
                        html5QrCode = new Html5Qrcode("reader");
                    }

                    await html5QrCode.start(
                        selectedCamId,
                        { fps: 10, qrbox: { width: 220, height: 220 } },
                        (decodedText) => {
                            document.getElementById('studentId').value = decodedText.trim();
                            loadStudentDetails();
                            toggleScanner(); // Auto-close scanner on scan success
                        },
                        (errorMessage) => {}
                    );
                } else {
                    alert("⚠️ No video cameras found on this device.");
                }
            } catch (err) {
                console.error("Camera Access Error:", err);
                if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                    alert("🚫 Camera permission denied!\n\nPlease tap the lock/tune icon near your URL address bar and change Camera permission to Allow.");
                } else if (err.name === 'NotReadableError' || err.name === 'TrackStartError') {
                    alert("📷 Camera is currently occupied by another app (e.g., Zoom, WhatsApp, or standard Camera). Please close background camera apps and try again.");
                } else {
                    alert("⚠️ Camera Error: " + (err.message || err));
                }
            }
        } else {
            if (html5QrCode) {
                await html5QrCode.stop().catch(() => {});
            }
            container.style.display = 'none';
            toggleText.innerText = 'Open Camera QR Scanner';
            isScannerOpen = false;
        }
    }

    // Process uploaded image files as QR code
    function uploadScanQr(event) {
        const file = event.target.files[0];
        if (!file) return;

        const scanner = new Html5Qrcode("reader");
        scanner.scanFile(file, true)
            .then(decodedText => {
                document.getElementById('studentId').value = decodedText.trim();
                loadStudentDetails();
            })
            .catch(err => alert('❌ Could not read QR code from image file. Ensure the photo is clear.'));
    }

    // Load student data & render phone number on screen
    function loadStudentDetails() {
        const id = document.getElementById('studentId').value.trim();
        if (!id) return alert('⚠️ Please enter or scan a Student ID.');

        db.ref('students/' + id).once('value', (snapshot) => {
            if (!snapshot.exists()) {
                alert('❌ Student ID not found!');
                document.getElementById('studentCard').style.display = 'none';
                loadedStudent = null;
                return;
            }

            loadedStudent = snapshot.val();

            // Extract contact number across multiple possible database keys
            const phoneNo = loadedStudent.phone || loadedStudent.whatsapp || loadedStudent.parentPhone || loadedStudent.mobile || 'Not Provided';

            document.getElementById('lblStudentName').innerText = loadedStudent.name || 'N/A';
            document.getElementById('lblGrade').innerText = loadedStudent.grade || 'N/A';
            document.getElementById('lblPhone').innerText = phoneNo;
            document.getElementById('lblStatus').innerText = loadedStudent.fee || 'Not Paid';
            document.getElementById('studentCard').style.display = 'block';
        });
    }

    // Mark attendance entry into Realtime Database
    function markAttendance() {
        const id = document.getElementById('studentId').value.trim();
        if (!id || !loadedStudent) return alert('⚠️ Please lookup student details first.');

        const today = new Date().toISOString().split('T')[0];
        const timeNow = new Date().toLocaleTimeString();

        db.ref(`attendance/${today}/${id}`).set({
            name: loadedStudent.name,
            grade: loadedStudent.grade,
            timestamp: timeNow,
            status: 'Present'
        }).then(() => {
            alert(`✅ Attendance marked for ${loadedStudent.name} (${id}) at ${timeNow}!`);
            document.getElementById('studentId').value = '';
            document.getElementById('studentCard').style.display = 'none';
            loadedStudent = null;
        }).catch(err => alert('❌ Error saving attendance: ' + err.message));
    }
</script>
</body>
</html>
