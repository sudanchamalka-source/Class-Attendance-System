<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Attendance Scanner</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; margin: 0; padding: 20px; background-color: #f8f9fa; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; }
        #reader { width: 100%; max-width: 320px; margin: 20px auto; border-radius: 8px; overflow: hidden; }
        #result { font-weight: bold; font-size: 1.1em; color: #007bff; margin-top: 15px; }
        .nav-links { margin-top: 25px; padding-top: 15px; border-top: 1px solid #eee; display: flex; justify-content: space-around; flex-wrap: wrap; gap: 10px; }
        .nav-links a { text-decoration: none; color: #495057; font-weight: 600; font-size: 0.9em; }
        #statusMsg { margin-top: 15px; padding: 10px; border-radius: 6px; display: none; font-weight: bold; font-size: 0.9em; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<div class="container">
    <h2>QR Attendance Scanner</h2>
    <div id="reader"></div>
    <p id="result">QR කේතය Scan කිරීමට Camera එක පෙන්වන්න</p>
    <div id="statusMsg"></div>

    <div class="nav-links">
        <a href="register.html">ලියාපදිංචිය</a>
        <a href="qr_generator.html">QR Generator</a>
        <a href="admin_fees.html">Admin Panel</a>
        <a href="students_list.html">සියලු සිසුන්</a>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAP97Utjqx54gmf9YaMsgWSK96TGTUCuSg",
        authDomain: "class-management-system-8c1a1.firebaseapp.com",
        databaseURL: "https://class-management-system-8c1a1-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "class-management-system-8c1a1",
        storageBucket: "class-management-system-8c1a1.firebasestorage.app",
        messagingSenderId: "759521896885",
        appId: "1:759521896885:web:ab834180d9ab45968791fc",
        measurementId: "G-XZW2VLFXT2"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    let isScanning = true;

    function showStatus(msg, isSuccess) {
        const statusDiv = document.getElementById('statusMsg');
        statusDiv.style.display = 'block';
        statusDiv.className = isSuccess ? 'success' : 'error';
        statusDiv.innerText = msg;
    }

    function onScanSuccess(decodedText) {
        if(!isScanning) return;
        isScanning = false;

        document.getElementById('result').innerText = "Scan කළ අංකය: " + decodedText;
        markAttendance(decodedText);

        setTimeout(() => { isScanning = true; }, 3000);
    }

    function markAttendance(studentId) {
        const date = new Date().toISOString().split('T')[0];
        const month = date.slice(0, 7);
        const time = new Date().toLocaleTimeString();

        database.ref('attendance/' + date + '/' + studentId).set({
            time: time,
            status: "Present"
        }).then(() => {
            showStatus("✅ පැමිණීම සටහන් විය! WhatsApp වෙත යොමු කෙරේ...", true);
            sendWhatsAppMsg(studentId, date, month, time);
        }).catch((error) => {
            showStatus("❌ දෝෂයක් සිදු විය: " + error.message, false);
        });
    }

    function sendWhatsAppMsg(studentId, date, month, time) {
        database.ref('students/' + studentId).once('value').then((snapshot) => {
            if (snapshot.exists()) {
                const student = snapshot.val();
                if (student.phone) {
                    const monthFee = (student.fees && student.fees[month]) ? student.fees[month] : "Pending";
                    const statusText = monthFee === "Paid" ? "ගෙවා ඇත ✅" : "ගෙවීමට ඇත ⚠️";
                    
                    const message = encodeURIComponent(
                        `*පන්ති පැමිණීමේ සටහන*

` +
                        `නම: ${student.name}
` +
                        `දිනය: ${date}
` +
                        `වේලාව: ${time}
` +
                        `${month} මාසයේ ගාස්තු: ${statusText}

` +
                        `ස්තූතියි!
- R.M.S.Chamalka Sir`
                    );
                    
                    window.location.href = `https://wa.me/${student.phone}?text=${message}`;
                } else {
                    showStatus("⚠️ දුරකථන අංකය නොමැත!", false);
                }
            } else {
                showStatus("⚠️ මෙම ID එකට අදාළ ශිෂ්‍යයෙකු සොයාගත නොහැකි විය!", false);
            }
        });
    }

    let html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
    html5QrcodeScanner.render(onScanSuccess);
</script>

</body>
</html>
