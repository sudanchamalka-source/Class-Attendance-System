<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard - Class Attendance & Management</title>
    <!-- Firebase SDK (v8 Compatibility Layer) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: #1e3a8a;
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-left: 5px solid #2563eb;
        }

        .stat-card h4 {
            font-size: 13px;
            color: #6b7280;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .stat-card p {
            font-size: 24px;
            font-weight: bold;
            color: #1f2937;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .controls input, .controls select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            flex: 1;
            min-width: 200px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background-color: #1e293b;
            color: white;
            font-weight: 600;
        }

        tr:hover {
            background-color: #f8f9fa;
        }

        .status-badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-paid { background-color: #d1fae5; color: #065f46; }
        .status-pending { background-color: #fee2e2; color: #991b1b; }

        .btn-action {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            margin-right: 5px;
            color: white;
        }

        .btn-mark { background-color: #16a34a; }
        .btn-details { background-color: #2563eb; }

        /* Detail Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 8px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .modal-content h3 { margin-bottom: 15px; }

        .modal-actions {
            margin-top: 20px;
            text-align: right;
        }

        .btn-close {
            background: #6b7280;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h2>Teacher Dashboard</h2>
        <span id="currentDateDisplay">Date: Loading...</span>
    </header>

    <div class="stats-grid">
        <div class="stat-card">
            <h4>Total Students</h4>
            <p id="statTotal">0</p>
        </div>
        <div class="stat-card" style="border-left-color: #16a34a;">
            <h4>Fees Paid</h4>
            <p id="statPaid">0</p>
        </div>
        <div class="stat-card" style="border-left-color: #dc2626;">
            <h4>Fees Pending</h4>
            <p id="statPending">0</p>
        </div>
    </div>

    <div class="controls">
        <input type="text" id="searchInput" placeholder="Search by name, ID, or phone..." onkeyup="filterStudents()">
        <select id="gradeFilter" onchange="filterStudents()">
            <option value="ALL">All Grades</option>
        </select>
        <select id="statusFilter" onchange="filterStudents()">
            <option value="ALL">All Payment Statuses</option>
            <option value="PAID">Paid Only</option>
            <option value="PENDING">Pending Only</option>
        </select>
    </div>

    <table>
        <thead>
            <tr>
                <th>Student ID</th>
                <th>Name</th>
                <th>Grade</th>
                <th>Contact</th>
                <th>Payment Status</th>
                <th>Class Fee</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="studentsTableBody">
            <tr>
                <td colspan="7" style="text-align: center;">Loading student records...</td>
            </tr>
        </tbody>
    </table>
</div>

<!-- Student Info Modal -->
<div id="infoModal" class="modal">
    <div class="modal-content">
        <h3 id="modalName">Student Information</h3>
        <div id="modalDetails"></div>
        <div class="modal-actions">
            <button class="btn-close" onclick="closeModal('infoModal')">Close</button>
        </div>
    </div>
</div>

<script>
    // Firebase Configuration
    const firebaseConfig = {
        apiKey: "AIzaSyAP97Utjqx54gmf9YaMsgWSK96TGTUCuSg",
        authDomain: "class-management-system-8c1a1.firebaseapp.com",
        databaseURL: "https://class-management-system-8c1a1-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "class-management-system-8c1a1",
        storageBucket: "class-management-system-8c1a1.firebasestorage.app",
        messagingSenderId: "759521896885",
        appId: "1:759521896885:web:ab834180d9ab45968791fc",
        measurementId: "G-XZW2VLFXT2"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    let allStudentsCache = [];

    // Set Header Date
    document.getElementById('currentDateDisplay').innerText = 'Date: ' + new Date().toLocaleDateString();

    // Fetch All Students from Firebase Realtime Database
    function loadTeacherDashboardData() {
        const tableBody = document.getElementById('studentsTableBody');

        db.ref('students').on('value', (snapshot) => {
            allStudentsCache = [];
            let paidCount = 0;
            let pendingCount = 0;
            const gradeSet = new Set();

            if (!snapshot.exists()) {
                tableBody.innerHTML = '<tr><td colspan="7" style="text-align: center;">No student records found.</td></tr>';
                updateStats(0, 0, 0);
                return;
            }

            snapshot.forEach((childSnap) => {
                const stu = childSnap.val();
                const id = childSnap.key;

                const phone = stu.phone || stu.whatsapp || stu.parentPhone || stu.mobile || 'N/A';
                const classFee = (stu.classFee !== undefined && stu.classFee !== null) ? stu.classFee : (stu.monthlyFee || stu.feeAmount || 0);
                const isPaid = stu.fee === 'Paid' || stu.status === 'Paid';
                const feeStatus = isPaid ? `Paid (${stu.lastPaymentMonth || 'Yes'})` : `Pending`;

                if (stu.grade) gradeSet.add(stu.grade);
                if (isPaid) paidCount++; else pendingCount++;

                allStudentsCache.push({
                    id: id,
                    name: stu.name || 'N/A',
                    grade: stu.grade || 'N/A',
                    phone: phone,
                    feeStatus: feeStatus,
                    isPaid: isPaid,
                    classFee: classFee
                });
            });

            populateGradeFilter(Array.from(gradeSet));
            updateStats(allStudentsCache.length, paidCount, pendingCount);
            renderTable(allStudentsCache);
        }, (error) => {
            console.error(error);
            tableBody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: red;">⚠️ Database Error: ${error.message}</td></tr>`;
        });
    }

    function updateStats(total, paid, pending) {
        document.getElementById('statTotal').innerText = total;
        document.getElementById('statPaid').innerText = paid;
        document.getElementById('statPending').innerText = pending;
    }

    function populateGradeFilter(grades) {
        const gradeSelect = document.getElementById('gradeFilter');
        const currentVal = gradeSelect.value;
        gradeSelect.innerHTML = '<option value="ALL">All Grades</option>';
        grades.forEach(g => {
            const opt = document.createElement('option');
            opt.value = g;
            opt.innerText = g;
            gradeSelect.appendChild(opt);
        });
        gradeSelect.value = currentVal;
    }

    // Render Student Data Rows
    function renderTable(dataList) {
        const tableBody = document.getElementById('studentsTableBody');
        tableBody.innerHTML = '';

        if (dataList.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="7" style="text-align: center;">No matching student records found.</td></tr>';
            return;
        }

        dataList.forEach((stu) => {
            const badgeClass = stu.isPaid ? 'status-paid' : 'status-pending';
            const escapedName = stu.name.replace(/'/g, "\\'");

            const row = `
                <tr>
                    <td><strong>${stu.id}</strong></td>
                    <td>${stu.name}</td>
                    <td>${stu.grade}</td>
                    <td>${stu.phone}</td>
                    <td><span class="status-badge ${badgeClass}">${stu.feeStatus}</span></td>
                    <td>${parseFloat(stu.classFee) > 0 ? 'LKR ' + parseFloat(stu.classFee).toFixed(2) : 'LKR 0.00'}</td>
                    <td>
                        <button class="btn-action btn-mark" onclick="togglePaymentStatus('${stu.id}', ${stu.isPaid})">${stu.isPaid ? 'Mark Pending' : 'Mark Paid'}</button>
                        <button class="btn-action btn-details" onclick="viewStudentModal('${stu.id}', '${escapedName}', '${stu.grade}', '${stu.phone}', '${stu.feeStatus}', '${stu.classFee}')">🔍 View</button>
                    </td>
                </tr>
            `;
            tableBody.innerHTML += row;
        });
    }

    // Dynamic Search & Filter Functionality
    function filterStudents() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        const selectedGrade = document.getElementById('gradeFilter').value;
        const selectedStatus = document.getElementById('statusFilter').value;

        const filtered = allStudentsCache.filter((stu) => {
            const matchesSearch = stu.name.toLowerCase().includes(searchTerm) || 
                                  stu.id.toLowerCase().includes(searchTerm) || 
                                  stu.phone.toLowerCase().includes(searchTerm);
            
            const matchesGrade = (selectedGrade === 'ALL') || (stu.grade === selectedGrade);

            let matchesStatus = true;
            if (selectedStatus === 'PAID') matchesStatus = stu.isPaid;
            if (selectedStatus === 'PENDING') matchesStatus = !stu.isPaid;

            return matchesSearch && matchesGrade && matchesStatus;
        });

        renderTable(filtered);
    }

    // Toggle Fee Payment Status
    function togglePaymentStatus(id, currentPaidState) {
        const newStatus = currentPaidState ? 'Pending' : 'Paid';
        const updates = {
            fee: newStatus,
            status: newStatus,
            lastPaymentMonth: currentPaidState ? null : new Date().toLocaleString('default', { month: 'long' })
        };

        db.ref('students/' + id).update(updates)
            .then(() => alert(`Payment status updated to ${newStatus} for ID: ${id}`))
            .catch((err) => alert('Error updating payment status: ' + err.message));
    }

    // View Details Modal
    function viewStudentModal(id, name, grade, phone, status, fee) {
        document.getElementById('modalName').innerText = name;
        document.getElementById('modalDetails').innerHTML = `
            <p><strong>Student ID:</strong> ${id}</p>
            <p><strong>Grade/Class:</strong> ${grade}</p>
            <p><strong>Contact Phone:</strong> ${phone}</p>
            <p><strong>Payment Status:</strong> ${status}</p>
            <p><strong>Monthly Class Fee:</strong> LKR ${parseFloat(fee).toFixed(2)}</p>
        `;
        document.getElementById('infoModal').style.display = 'flex';
    }

    function closeModal(modalId) {
        document.getElementById(modalId).style.display = 'none';
    }

    // Initialize Event Listener
    document.addEventListener('DOMContentLoaded', loadTeacherDashboardData);
</script>

</body>
</html>
