<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student ID Card Preview</title>
    <link rel="icon" type="image/png" href="logo.png">
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        h2 { color: #003366; }
        
        .card-container {
            width: 420px;
            height: 240px;
            background: linear-gradient(135deg, #002b66, #0056b3);
            border-radius: 16px;
            color: white;
            padding: 15px 20px;
            box-sizing: border-box;
            position: relative;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 8px; }
        .header-title { font-size: 0.85em; font-weight: bold; letter-spacing: 1px; color: #ffcc00; }
        .badge { background: #ffcc00; color: #000; padding: 2px 8px; border-radius: 10px; font-size: 0.7em; font-weight: bold; }

        .card-body { display: flex; align-items: center; margin-top: 15px; gap: 15px; }
        .stu-photo { width: 85px; height: 85px; border-radius: 10px; border: 2px solid #ffcc00; object-fit: cover; background: #fff; }

        .info { flex: 1; }
        .stu-id { color: #ffcc00; font-weight: bold; font-size: 1.1em; }
        .stu-name { font-size: 1em; font-weight: bold; margin: 4px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 170px; }
        .stu-detail { font-size: 0.8em; color: #e0e0e0; margin: 2px 0; }

        .qr-code { background: white; padding: 5px; border-radius: 8px; width: 70px; height: 70px; display: flex; justify-content: center; align-items: center; }

        .footer { position: absolute; bottom: 10px; left: 20px; right: 20px; display: flex; justify-content: space-between; font-size: 0.65em; color: #b3d1ff; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 5px; }

        .btn-group { margin-top: 20px; display: flex; gap: 10px; }
        .btn { padding: 10px 18px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: white; display: flex; align-items: center; gap: 5px; text-decoration: none; }
        .btn-print { background: #28a745; }
        .btn-png { background: #fd7e14; }

        @media print {
            body * { visibility: hidden; }
            #idCard, #idCard * { visibility: visible; }
            #idCard { position: absolute; left: 0; top: 0; }
            .btn-group, h2 { display: none; }
        }
    </style>
</head>
<body>

    <h2>🪪 Student ID Card Preview</h2>

    <div class="card-container" id="idCard">
        <div class="header">
            <span class="header-title">CLASS ADMISSION CARD</span>
            <span class="badge">STUDENT</span>
        </div>

        <div class="card-body">
            <img id="cardPhoto" src="logo.png" class="stu-photo" alt="Photo">
            <div class="info">
                <div class="stu-id" id="cardId">ID: Loading...</div>
                <div class="stu-name" id="cardName">Loading...</div>
                <div class="stu-detail" id="cardGrade">Grade: -</div>
                <div class="stu-detail" id="cardPhone">Phone: -</div>
            </div>
            <div class="qr-code" id="qrcode"></div>
        </div>

        <div class="footer">
            <span>CLASS MANAGEMENT SYSTEM</span>
            <span>Official Student Identity Card</span>
        </div>
    </div>

    <div class="btn-group">
        <button class="btn btn-print" onclick="window.print()">🖨️ Print ID Card</button>
        <button class="btn btn-png" onclick="downloadPNG()">📥 Download PNG</button>
    </div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAP97Utjqx54gmf9YaMsgWSK96TGTUCuSg",
        authDomain: "class-management-system-8c1a1.firebaseapp.com",
        databaseURL: "https://class-management-system-8c1a1-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "class-management-system-8c1a1",
        storageBucket: "class-management-system-8c1a1.firebasestorage.app",
        messagingSenderId: "759521896885",
        appId: "1:759521896885:web:ab834180d9ab45968791fc",
        measurementId: "G-XZW2VLFXT2"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const urlParams = new URLSearchParams(window.location.search);
    const stuIdParam = urlParams.get('id');

    if (stuIdParam) {
        // Direct Query or Search by 'id' child property
        db.ref('students/' + stuIdParam).once('value', (snapshot) => {
            if (snapshot.exists()) {
                renderCard(snapshot.val(), stuIdParam);
            } else {
                // Fallback search if Key is different from ID property
                db.ref('students').orderByChild('id').equalTo(stuIdParam).once('value', (searchSnap) => {
                    if (searchSnap.exists()) {
                        searchSnap.forEach(child => renderCard(child.val(), stuIdParam));
                    } else {
                        alert('ශිෂ්‍ය දත්ත හමු නොවිණි!');
                    }
                });
            }
        });
    }

    function renderCard(data, displayId) {
        const finalId = data.id || data.stuId || displayId;
        document.getElementById('cardId').innerText = "ID: " + finalId;
        document.getElementById('cardName').innerText = data.name || 'N/A';
        document.getElementById('cardGrade').innerText = "Grade: " + (data.grade || 'N/A');
        document.getElementById('cardPhone').innerText = "Phone: " + (data.phone || 'N/A');
        
        if (data.photo) {
            document.getElementById('cardPhoto').src = data.photo;
        }

        // Generate QR Code with ID
        document.getElementById("qrcode").innerHTML = "";
        new QRCode(document.getElementById("qrcode"), {
            text: finalId,
            width: 60,
            height: 60
        });
    }

    function downloadPNG() {
        const card = document.getElementById("idCard");
        html2canvas(card, { scale: 3 }).then(canvas => {
            const link = document.createElement('a');
            link.download = `ID_CARD_${document.getElementById('cardId').innerText.replace('ID: ', '')}.png`;
            link.href = canvas.toDataURL("image/png");
            link.click();
        });
    }
</script>
</body>
</html>
