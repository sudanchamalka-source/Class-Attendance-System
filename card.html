<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student ID Card - English with Sudan Sir</title>
    <link rel="icon" type="image/png" href="logo.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eef2f5; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 90vh; }
        
        .id-card {
            width: 320px;
            height: 480px;
            background: linear-gradient(135deg, #ffffff, #f0f4f8);
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            border: 2px solid #003366;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .header { border-bottom: 2px solid #003366; padding-bottom: 10px; }
        .logo { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; }
        .title { color: #003366; font-size: 1.1em; font-weight: bold; margin: 5px 0 0 0; }
        .subtitle { color: #555; font-size: 0.8em; margin: 0; }

        .student-info { margin: 15px 0; }
        .student-name { font-size: 1.2em; font-weight: bold; color: #111; margin-bottom: 5px; }
        .student-id { font-size: 1em; color: #0080ff; font-weight: bold; background: #e3f2fd; display: inline-block; padding: 4px 12px; border-radius: 20px; }

        .qr-container { display: flex; justify-content: center; margin: 10px 0; }
        #qrcode img { border: 4px solid #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }

        .footer { font-size: 0.75em; color: #777; border-top: 1px solid #ddd; padding-top: 8px; }

        .print-btn {
            margin-top: 20px;
            background: #003366;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
        }

        @media print {
            body { background: white; padding: 0; }
            .print-btn { display: none; }
            .id-card { box-shadow: none; }
        }
    </style>
</head>
<body>

<div class="id-card" id="card">
    <div class="header">
        <img src="logo.png" alt="Logo" class="logo">
        <div class="title">English with Sudan Sir</div>
        <div class="subtitle">Student Identification Card</div>
    </div>

    <div class="student-info">
        <div class="student-name" id="studentName">Loading...</div>
        <div class="student-id" id="studentIdDisplay">ID: ---</div>
    </div>

    <div class="qr-container">
        <div id="qrcode"></div>
    </div>

    <div class="footer">
        මෙම කාඩ්පත පන්තියට පැමිණෙන සෑම දිනකම රැගෙන ආ යුතුය.
    </div>
</div>

<button class="print-btn" onclick="window.print()">🖨️ ID Card එක Print කරන්න</button>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAP97Utjqx54gmf9YaMsgWSK96TGTUCuSg",
        authDomain: "class-management-system-8c1a1.firebaseapp.com",
        databaseURL: "https://class-management-system-8c1a1-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "class-management-system-8c1a1",
        storageBucket: "class-management-system-8c1a1.firebasestorage.app",
        messagingSenderId: "759521896885",
        appId: "1:759521896885:web:ab834180d9ab45968791fc",
        measurementId: "G-XZW2VLFXT2"
    };
    firebase.initializeApp(firebaseConfig);

    // URL එකෙන් ID එක ලබා ගැනීම (e.g. card.html?id=STU1001)
    const urlParams = new URLSearchParams(window.location.search);
    const studentId = urlParams.get('id');

    if (studentId) {
        document.getElementById('studentIdDisplay').innerText = "ID: " + studentId;

        // Firebase එකෙන් ශිෂ්‍යයාගේ නම සෙවීම
        firebase.database().ref('students/' + studentId).once('value', (snapshot) => {
            if (snapshot.exists()) {
                document.getElementById('studentName').innerText = snapshot.val().name || "Student";
            } else {
                document.getElementById('studentName').innerText = "නම හමු නොවීය";
            }
        });

        // QR Code එක Generate කිරීම
        new QRCode(document.getElementById("qrcode"), {
            text: studentId,
            width: 120,
            height: 120
        });
    } else {
        document.getElementById('studentName').innerText = "Invalid Request";
    }
</script>
</body>
</html>
