<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ශිෂ්‍ය හැඳුනුම්පත - English with Sudan Sir</title>
  <meta name="theme-color" content="#14246b">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="shared.css">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="shared.js"></script>
  <style>
    .stage { display: flex; flex-direction: column; align-items: center; gap: 20px; }

    /* CR80 අනුපාතයට (85.6 × 54 මි.මී.) ගැළපෙන ලෙස 450 × 284 */
    .id-card { position: relative; width: 450px; height: 284px; padding: 16px 20px; border-radius: 18px; overflow: hidden; color: #fff;
      background: radial-gradient(circle at 105% -10%, rgba(255,207,38,.9) 0 70px, transparent 71px), linear-gradient(135deg, #14246b 0%, #1f4fd8 100%); }
    .id-head { display: flex; align-items: center; gap: 12px; padding-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,.28); }
    .id-head img { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--sun); background: #fff; object-fit: cover; }
    .id-head h3 { margin: 0; font-size: 1.1rem; font-weight: 800; letter-spacing: .3px; line-height: 1.2; }
    .id-head span { font-size: .78rem; font-weight: 700; color: var(--sun); }

    .id-body { display: flex; align-items: center; gap: 14px; margin-top: 16px; }
    .id-photo { width: 96px; height: 96px; border-radius: 12px; border: 3px solid #fff; object-fit: cover; background: #fff; flex: none; }
    .id-info { flex: 1; min-width: 0; }
    .id-name { font-size: 1.08rem; font-weight: 800; line-height: 1.35; margin-bottom: 6px; word-break: break-word; }
    .id-badge { display: inline-block; background: var(--sun); color: #1b2142; font-weight: 800; padding: 2px 12px; border-radius: 999px; font-size: .88rem; margin-bottom: 4px; }
    .id-extra { font-size: .82rem; color: #d5e4ff; line-height: 1.5; }
    .qr { flex: none; width: 78px; height: 78px; padding: 6px; background: #fff; border-radius: 10px; display: flex; align-items: center; justify-content: center; }

    .id-foot { position: absolute; left: 20px; right: 20px; bottom: 10px; display: flex; justify-content: space-between; gap: 8px; padding-top: 6px; border-top: 1px solid rgba(255,255,255,.22); font-size: .72rem; color: #c3d8ff; }

    .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }

    @media (max-width: 500px) { .id-card { transform: scale(.78); transform-origin: top center; margin-bottom: -60px; } }
    @media print {
      body * { visibility: hidden; }
      #idCard, #idCard * { visibility: visible; }
      #idCard { position: absolute; left: 0; top: 0; transform: none; margin: 0; }
    }
  </style>
</head>
<body>
<div id="chrome"></div>

<main class="wrap">
  <h2 class="ribbon noprint">ශිෂ්‍ය හැඳුනුම්පත</h2>

  <section class="card noprint" style="--accent: var(--purple); max-width: 600px; margin-inline: auto">
    <div class="row">
      <div class="grow">
        <label class="label" for="lookupId">ශිෂ්‍ය හැඳුනුම් අංකය</label>
        <input type="text" id="lookupId" placeholder="උදා: STU1001" autocomplete="off">
      </div>
      <button type="button" class="btn navy" id="lookupBtn">හැඳුනුම්පත පෙන්වන්න</button>
    </div>
  </section>

  <div class="stage">
    <div class="id-card" id="idCard">
      <div class="id-head">
        <img src="logo.png" alt="">
        <div><h3>English with Sudan Sir</h3><span>ශිෂ්‍ය නිල හැඳුනුම්පත</span></div>
      </div>
      <div class="id-body">
        <img class="id-photo" id="cardPhoto" src="logo.png" alt="ශිෂ්‍ය ඡායාරූපය">
        <div class="id-info">
          <div class="id-name" id="cardName">ශිෂ්‍යයාගේ නම</div>
          <div class="id-badge" id="cardId">අංකය: -</div>
          <div class="id-extra" id="cardGrade">ශ්‍රේණිය: -</div>
          <div class="id-extra" id="cardPhone">දුරකථන: -</div>
        </div>
        <div class="qr" id="qrcode"></div>
      </div>
      <div class="id-foot"><span>බලයලත් ශිෂ්‍ය හැඳුනුම්පත</span><span>අධ්‍යයන වර්ෂය සඳහා වලංගුයි</span></div>
    </div>

    <div class="actions noprint">
      <button type="button" class="btn navy" onclick="window.print()">මුද්‍රණය කරන්න</button>
      <button type="button" class="btn green" onclick="exportCard('jpg')">JPG ලෙස බාගන්න</button>
      <button type="button" class="btn red" onclick="exportCard('pdf')">PDF ලෙස බාගන්න</button>
    </div>
  </div>
</main>

<script>
  mountChrome({ nav: false });

  let shownId = '';

  async function showCard(rawId) {
    const found = await findStudent(rawId);
    if (!found) return toast('ශිෂ්‍ය දත්ත හමු නොවිණි.', 'bad');
    const d = found.data;
    shownId = d.id || d.stuId || found.key;

    $('cardId').textContent = 'අංකය: ' + shownId;
    $('cardName').textContent = d.name || 'ශිෂ්‍යයාගේ නම';
    $('cardGrade').textContent = 'ශ්‍රේණිය: ' + (d.grade || '-');
    $('cardPhone').textContent = 'දුරකථන: ' + (studentPhone(d) || '-');
    $('cardPhoto').src = d.photo || 'logo.png';

    $('qrcode').innerHTML = '';
    new QRCode($('qrcode'), { text: shownId, width: 64, height: 64 });
  }

  $('lookupBtn').addEventListener('click', () => showCard($('lookupId').value));
  $('lookupId').addEventListener('keydown', e => { if (e.key === 'Enter') showCard($('lookupId').value); });

  // JPG සහ PDF බාගැනීමට එකම ශ්‍රිතය (පෙර කේතය දෙවරක් ලියා තිබුණි)
  async function exportCard(type) {
    if (!shownId) return toast('මුලින්ම ශිෂ්‍යයා සොයන්න.', 'bad');
    await document.fonts.ready;
    const card = $('idCard');
    const prev = card.style.transform;
    card.style.transform = 'none';                 // phone එකේ කුඩා කරන ලද scale එක රූපයට බලපාන්නේ නැති ලෙස
    const canvas = await html2canvas(card, { scale: 3 });
    card.style.transform = prev;

    if (type === 'jpg') {
      const a = document.createElement('a');
      a.download = `ID_CARD_${shownId}.jpg`;
      a.href = canvas.toDataURL('image/jpeg', 0.92);
      a.click();
    } else {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF('landscape', 'mm', [85.6, 54]);
      pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, 85.6, 54);
      pdf.save(`ID_CARD_${shownId}.pdf`);
    }
  }

  const idParam = new URLSearchParams(location.search).get('id');
  if (idParam) { $('lookupId').value = idParam; showCard(idParam); }
</script>
</body>
</html>
