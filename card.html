<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Official Pass</title>
    <link rel="icon" type="image/png" href="logo.png">
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eef2f5; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        .card-container {
            width: 450px;
            height: 270px;
            background: linear-gradient(135deg, #0b4f9c, #0076e6);
            border-radius: 18px;
            color: white;
            padding: 16px 20px;
            box-sizing: border-box;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
            overflow: hidden;
        }

        /* Top Header Area */
        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.25);
            padding-bottom: 8px;
        }

        .header-logo {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2px solid #ffcc00;
            background: #fff;
            object-fit: cover;
        }

        .header-text h3 {
            margin: 0;
            font-size: 1.1em;
            color: #ffffff;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .header-text span {
            font-size: 0.65em;
            color: #ffcc00;
            font-weight: bold;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* Middle Body Area */
        .card-body {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 15px;
            gap: 10px;
        }

        .stu-photo {
            width: 95px;
            height: 95px;
            border-radius: 12px;
            border: 3px solid #ffffff;
            object-fit: cover;
            background: #fff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }

        .stu-details {
            flex: 1;
            padding-left: 5px;
        }

        .stu-name {
            font-size: 1.05em;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 8px;
            line-height: 1.2;
            word-break: break-word;
        }

        .stu-id-badge {
            display: inline-block;
            background: #ffcc00;
            color: #000;
            font-weight: 800;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .stu-extra {
            font-size: 0.72em;
            color: #d1e5ff;
            margin: 2px 0;
        }

        /* Right QR Code */
        .qr-box {
            background: white;
            padding: 6px;
            border-radius: 10px;
            width: 75px;
            height: 75px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        /* Bottom Footer Area */
        .card-footer {
            position: absolute;
            bottom: 10px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 0.65em;
            color: #b3d1ff;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            padding-top: 6px;
        }

        /* Action Buttons */
        .btn-group {
            margin-top: 25px;
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9em;
            transition: 0.2s ease;
        }

        .btn-print { background: #003366; }
        .btn-jpg { background: #28a745; }
        .btn-pdf { background: #dc3545; }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }

        @media print {
            body * { visibility: hidden; }
            #idCard, #idCard * { visibility: visible; }
            #idCard { position: absolute; left: 0; top: 0; }
            .btn-group { display: none; }
        }
    </style>
</head>
<body>

    <div class="card-container" id="idCard">
        <div class="card-header">
            <img src="logo.png" class="header-logo" alt="Logo">
            <div class="header-text">
                <h3>English with Sudan Sir</h3>
                <span>STUDENT OFFICIAL PASS</span>
            </div>
        </div>

        <div class="card-body">
            <img id="cardPhoto" src="logo.png" class="stu-photo" alt="Student Photo">
            
            <div class="stu-details">
                <div class="stu-name" id="cardName">Loading...</div>
                <div class="stu-id-badge" id="cardId">ID: BAT 003</div>
                <div class="stu-extra" id="cardGrade">Grade: -</div>
                <div class="stu-extra" id="cardPhone">Phone: -</div>
            </div>

            <div class="qr-box" id="qrcode"></div>
        </div>

        <div class="card-footer">
            <span>Authorized Student ID Card</span>
            <span>Valid for Academic Year</span>
        </div>
    </div>

    <div class="btn-group">
        <button class="btn btn-print" onclick="window.print()">🖨️ Print Card</button>
        <button class="btn btn-jpg" onclick="downloadJPG()">🖼️ Download JPG</button>
        <button class="btn btn-pdf" onclick="downloadPDF()">📄 Download PDF</button>
    </div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAP97Utjqx54gmf9YaMsgWSK96TGTUCuSg",
        authDomain: "class-management-system-8c1a1.firebaseapp.com",
        databaseURL: "https://class-management-system-8c1a1-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "class-management-system-8c1a1",
        storageBucket: "class-management-system-8c1a1.firebasestorage.app",
        messagingSenderId: "759521896885",
        appId: "1:759521896885:web:ab834180d9ab45968791fc",
        measurementId: "G-XZW2VLFXT2"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Fetch Student ID from URL Query Parameter
    const urlParams = new URLSearchParams(window.location.search);
    const stuIdParam = urlParams.get('id');

    if (stuIdParam) {
        db.ref('students/' + stuIdParam).once('value', (snapshot) => {
            if (snapshot.exists()) {
                renderCardData(snapshot.val(), stuIdParam);
            } else {
                // Fallback search if Key is auto-generated Push Key
                db.ref('students').orderByChild('id').equalTo(stuIdParam).once('value', (searchSnap) => {
                    if (searchSnap.exists()) {
                        searchSnap.forEach(child => renderCardData(child.val(), stuIdParam));
                    } else {
                        alert('ශිෂ්‍ය දත්ත හමු නොවිණි!');
                    }
                });
            }
        });
    }

    function renderCardData(data, key) {
        const displayId = data.id || data.stuId || key;
        
        document.getElementById('cardId').innerText = "ID: " + displayId;
        document.getElementById('cardName').innerText = data.name || 'Student Name';
        document.getElementById('cardGrade').innerText = "Grade: " + (data.grade || 'N/A');
        document.getElementById('cardPhone').innerText = "Phone: " + (data.phone || 'N/A');
        
        if (data.photo) {
            document.getElementById('cardPhoto').src = data.photo;
        }

        // QR Code Generation
        document.getElementById("qrcode").innerHTML = "";
        new QRCode(document.getElementById("qrcode"), {
            text: displayId,
            width: 65,
            height: 65
        });
    }

    function downloadJPG() {
        const card = document.getElementById("idCard");
        html2canvas(card, { scale: 3 }).then(canvas => {
            const link = document.createElement('a');
            const stuIdText = document.getElementById('cardId').innerText.replace('ID: ', '');
            link.download = `ID_CARD_${stuIdText}.jpg`;
            link.href = canvas.toDataURL("image/jpeg", 0.9);
            link.click();
        });
    }

    function downloadPDF() {
        const { jsPDF } = window.jspdf;
        const card = document.getElementById("idCard");
        
        html2canvas(card, { scale: 3 }).then(canvas => {
            const imgData = canvas.toDataURL('image/png');
            const pdf = new jsPDF('landscape', 'mm', [85.6, 54]); // Standard ID card size CR80
            pdf.addImage(imgData, 'PNG', 0, 0, 85.6, 54);
            const stuIdText = document.getElementById('cardId').innerText.replace('ID: ', '');
            pdf.save(`ID_CARD_${stuIdText}.pdf`);
        });
    }
</script>
</body>
</html>
