<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students List</title>
    <link rel="icon" type="image/png" href="logo.png">
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 12px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #0056b3; color: white; }
        a { text-decoration: none; color: #0056b3; display: block; text-align: center; margin-top: 15px; }
    </style>
</head>
<body>
<div class="container">
    <h2 style="color:#003366; text-align:center;">👥 සියලුම ශිෂ්‍යයන්ගේ ලැයිස්තුව</h2>
    <table>
        <thead>
            <tr><th>ID</th><th>නම</th><th>දුරකථන අංකය</th></tr>
        </thead>
        <tbody id="studentsTable"></tbody>
    </table>
    <a href="index.html">← Scanner වෙත ආපසු යන්න</a>
</div>
<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAP97Utjqx54gmf9YaMsgWSK96TGTUCuSg",
        authDomain: "class-management-system-8c1a1.firebaseapp.com",
        databaseURL: "https://class-management-system-8c1a1-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "class-management-system-8c1a1",
        storageBucket: "class-management-system-8c1a1.firebasestorage.app",
        messagingSenderId: "759521896885",
        appId: "1:759521896885:web:ab834180d9ab45968791fc",
        measurementId: "G-XZW2VLFXT2"
    };
    firebase.initializeApp(firebaseConfig);

    firebase.database().ref('students').once('value', (snapshot) => {
        const table = document.getElementById('studentsTable');
        table.innerHTML = '';
        snapshot.forEach((child) => {
            const data = child.val();
            table.innerHTML += `<tr><td>${child.key}</td><td>${data.name}</td><td>${data.phone}</td></tr>`;
        });
    });
</script>
</body>
</html>
