<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Students & Payments Management</title>
    <link rel="icon" type="image/png" href="logo.png">
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1100px; margin: auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h2 { color: #003366; margin-top: 0; text-align: center; }
        .nav-links { margin-bottom: 20px; text-align: center; }
        .nav-links a { text-decoration: none; color: #0056b3; font-weight: bold; margin: 0 10px; }
        
        /* Table Styles */
        .table-responsive { overflow-x: auto; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; background: #fff; font-size: 0.9em; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; vertical-align: middle; }
        th { background: #003366; color: white; text-align: center; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        
        /* Form Inputs in Table */
        input[type="text"], input[type="date"], select { width: 100%; padding: 6px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 0.95em; }
        
        .btn { padding: 6px 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; color: white; font-size: 0.85em; }
        .btn-save { background: #28a745; margin-bottom: 3px; width: 100%; }
        .btn-delete { background: #dc3545; width: 100%; }
        .btn-card { background: #007bff; width: 100%; margin-bottom: 3px; display: inline-block; text-align: center; text-decoration: none; box-sizing: border-box; padding: 6px 0; }
        
        .stu-img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; }
    </style>
</head>
<body>

<div class="container">
    <h2>📚 ශිෂ්‍ය තොරතුරු සහ ගෙවීම් සංස්කරණය (All Students & Edit Options)</h2>
    
    <div class="nav-links">
        <a href="index.html">← Scanner</a> | 
        <a href="register.html">+ New Registration</a>
    </div>

    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>Photo</th>
                    <th>ID</th>
                    <th>Full Name</th>
                    <th>Grade</th>
                    <th>WhatsApp No</th>
                    <th>Payment / Fee Status</th>
                    <th>Payment Date</th>
                    <th>Other Notes</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="studentTableBody">
                <tr><td colspan="9" style="text-align: center;">දත්ත ලෝඩ් වෙමින් පවතියි...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAP97Utjqx54gmf9YaMsgWSK96TGTUCuSg",
        authDomain: "class-management-system-8c1a1.firebaseapp.com",
        databaseURL: "https://class-management-system-8c1a1-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "class-management-system-8c1a1",
        storageBucket: "class-management-system-8c1a1.firebasestorage.app",
        messagingSenderId: "759521896885",
        appId: "1:759521896885:web:ab834180d9ab45968791fc",
        measurementId: "G-XZW2VLFXT2"
    };
    firebase.initializeApp(firebaseConfig);

    const db = firebase.database();

    // Fetch and display all students
    db.ref('students').on('value', (snapshot) => {
        const tbody = document.getElementById('studentTableBody');
        tbody.innerHTML = '';

        if (!snapshot.exists()) {
            tbody.innerHTML = '<tr><td colspan="9" style="text-align: center;">ශිෂ්‍යයන් හමු නොවීය.</td></tr>';
            return;
        }

        snapshot.forEach((childSnapshot) => {
            const id = childSnapshot.key;
            const data = childSnapshot.val();

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="text-align: center;">
                    <img src="${data.photo || 'logo.png'}" class="stu-img" alt="Photo">
                </td>
                <td><strong>${id}</strong></td>
                <td><input type="text" id="name_${id}" value="${data.name || ''}"></td>
                <td>
                    <select id="grade_${id}">
                        <option value="Grade 1" ${data.grade === 'Grade 1' ? 'selected' : ''}>Grade 1</option>
                        <option value="Grade 2" ${data.grade === 'Grade 2' ? 'selected' : ''}>Grade 2</option>
                        <option value="Grade 3" ${data.grade === 'Grade 3' ? 'selected' : ''}>Grade 3</option>
                        <option value="Grade 4" ${data.grade === 'Grade 4' ? 'selected' : ''}>Grade 4</option>
                        <option value="Grade 5" ${data.grade === 'Grade 5' ? 'selected' : ''}>Grade 5</option>
                        <option value="Grade 6" ${data.grade === 'Grade 6' ? 'selected' : ''}>Grade 6</option>
                        <option value="Grade 7" ${data.grade === 'Grade 7' ? 'selected' : ''}>Grade 7</option>
                        <option value="Grade 8" ${data.grade === 'Grade 8' ? 'selected' : ''}>Grade 8</option>
                        <option value="Grade 9" ${data.grade === 'Grade 9' ? 'selected' : ''}>Grade 9</option>
                        <option value="Grade 10" ${data.grade === 'Grade 10' ? 'selected' : ''}>Grade 10</option>
                        <option value="Grade 11" ${data.grade === 'Grade 11' ? 'selected' : ''}>Grade 11</option>
                        <option value="A/L" ${data.grade === 'A/L' ? 'selected' : ''}>A/L</option>
                        <option value="Other" ${data.grade === 'Other' ? 'selected' : ''}>Other</option>
                    </select>
                </td>
                <td><input type="text" id="phone_${id}" value="${data.phone || ''}"></td>
                <td><input type="text" id="fee_${id}" value="${data.fee || ''}" placeholder="උදා: Paid / Rs.1500"></td>
                <td><input type="date" id="date_${id}" value="${data.lastDate || ''}"></td>
                <td><input type="text" id="other_${id}" value="${data.other || ''}"></td>
                <td>
                    <a href="card.html?id=${id}" class="btn btn-card">🪪 ID Card</a>
                    <button class="btn btn-save" onclick="updateStudent('${id}')">💾 Save</button>
                    <button class="btn btn-delete" onclick="deleteStudent('${id}')">🗑️ Delete</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    });

    // Update function for fee, date, name, grade, etc.
    function updateStudent(id) {
        const name = document.getElementById(`name_${id}`).value.trim();
        const grade = document.getElementById(`grade_${id}`).value;
        const phone = document.getElementById(`phone_${id}`).value.trim();
        const fee = document.getElementById(`fee_${id}`).value.trim();
        const date = document.getElementById(`date_${id}`).value;
        const other = document.getElementById(`other_${id}`).value.trim();

        db.ref('students/' + id).update({
            name: name,
            grade: grade,
            phone: phone,
            fee: fee,
            lastDate: date,
            other: other
        }).then(() => {
            alert(`ID: ${id} ශිෂ්‍යයාගේ තොරතුරු සහ ගෙවීම් සාර්ථකව Update විය!`);
        }).catch((err) => {
            alert("Update Error: " + err.message);
        });
    }

    // Delete Student
    function deleteStudent(id) {
        if (confirm(`ඔබට ${id} ශිෂ්‍යයා මකා දැමීමට අවශ්‍යද?`)) {
            db.ref('students/' + id).remove().then(() => {
                alert('ශිෂ්‍යයා සාර්ථකව ඉවත් කරන ලදී!');
            });
        }
    }
</script>
</body>
</html>
