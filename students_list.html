<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Students & Attendance Admin Panel</title>
    <link rel="icon" type="image/png" href="logo.png">
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1200px; margin: auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h2 { color: #003366; margin-top: 0; text-align: center; }
        .nav-links { margin-bottom: 20px; text-align: center; font-size: 0.9em; }
        .nav-links a { text-decoration: none; color: #0056b3; font-weight: bold; margin: 0 8px; }
        
        .table-responsive { overflow-x: auto; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; background: #fff; font-size: 0.85em; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; vertical-align: middle; }
        th { background: #003366; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        
        input[type="text"], select { width: 100%; padding: 5px; box-sizing: border-box; border: 1px solid #0056b3; border-radius: 4px; }
        
        .btn { padding: 5px 8px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; color: white; font-size: 0.8em; width: 100%; margin-bottom: 3px; display: block; text-decoration: none; box-sizing: border-box; }
        .btn-edit { background: #ffc107; color: #333; }
        .btn-save { background: #28a745; display: none; }
        .btn-cancel { background: #6c757d; display: none; }
        .btn-delete { background: #dc3545; }
        .btn-reset-day { background: #fd7e14; padding: 2px 5px; font-size: 0.75em; margin-top: 3px; border-radius: 3px; }
        .btn-card { background: #007bff; }
        
        .stu-img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .status-present { color: #28a745; font-weight: bold; }
        .status-absent { color: #dc3545; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>📚 Admin Panel & Student Records</h2>
    
    <div class="nav-links">
        <a href="index.html">📸 Scanner</a> | 
        <a href="register.html">+ New Register</a> | 
        <a href="fee.html">💳 Fee Payment</a> | 
        <a href="students_list.html">📚 Admin Panel</a> | 
        <a href="teacher.html">👨‍🏫 Teacher Dashboard</a>
    </div>

    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>Photo</th>
                    <th>ID</th>
                    <th>Full Name</th>
                    <th>Grade</th>
                    <th>WhatsApp</th>
                    <th>Last Fee Record</th>
                    <th>Day 1</th>
                    <th>Day 2</th>
                    <th>Day 3</th>
                    <th>Day 4</th>
                    <th style="min-width: 90px;">Actions</th>
                </tr>
            </thead>
            <tbody id="studentTableBody">
                <tr><td colspan="11" style="text-align: center;">දත්ත ලෝඩ් වෙමින් පවතියි...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAP97Utjqx54gmf9YaMsgWSK96TGTUCuSg",
        authDomain: "class-management-system-8c1a1.firebaseapp.com",
        databaseURL: "https://class-management-system-8c1a1-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "class-management-system-8c1a1",
        storageBucket: "class-management-system-8c1a1.firebasestorage.app",
        messagingSenderId: "759521896885",
        appId: "1:759521896885:web:ab834180d9ab45968791fc",
        measurementId: "G-XZW2VLFXT2"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    db.ref('students').on('value', (snapshot) => {
        const tbody = document.getElementById('studentTableBody');
        tbody.innerHTML = '';

        if (!snapshot.exists()) {
            tbody.innerHTML = '<tr><td colspan="11" style="text-align: center;">ශිෂ්‍යයන් හමු නොවීය.</td></tr>';
            return;
        }

        snapshot.forEach((childSnapshot) => {
            const dbKey = childSnapshot.key;
            const data = childSnapshot.val();
            
            // Database Key එක හෝ Data Object එකේ ඇති Custom ID එක ලබාගැනීම
            const displayId = data.id || data.stuId || dbKey;
            const att = data.attendance || {};

            const tr = document.createElement('tr');
            tr.id = `row_${dbKey}`;
            tr.innerHTML = `
                <td><img src="${data.photo || 'logo.png'}" class="stu-img" alt="Photo"></td>
                <td><strong>${displayId}</strong></td>
                
                <td>
                    <span class="view-mode">${data.name || '-'}</span>
                    <input type="text" class="edit-mode" id="input_name_${dbKey}" value="${data.name || ''}" style="display:none;">
                </td>
                
                <td>
                    <span class="view-mode">${data.grade || '-'}</span>
                    <select class="edit-mode" id="input_grade_${dbKey}" style="display:none;">
                        <option value="Grade 1" ${data.grade === 'Grade 1' ? 'selected' : ''}>Grade 1</option>
                        <option value="Grade 2" ${data.grade === 'Grade 2' ? 'selected' : ''}>Grade 2</option>
                        <option value="Grade 3" ${data.grade === 'Grade 3' ? 'selected' : ''}>Grade 3</option>
                        <option value="Grade 4" ${data.grade === 'Grade 4' ? 'selected' : ''}>Grade 4</option>
                        <option value="Grade 5" ${data.grade === 'Grade 5' ? 'selected' : ''}>Grade 5</option>
                        <option value="Grade 6" ${data.grade === 'Grade 6' ? 'selected' : ''}>Grade 6</option>
                        <option value="Grade 7" ${data.grade === 'Grade 7' ? 'selected' : ''}>Grade 7</option>
                        <option value="Grade 8" ${data.grade === 'Grade 8' ? 'selected' : ''}>Grade 8</option>
                        <option value="Grade 9" ${data.grade === 'Grade 9' ? 'selected' : ''}>Grade 9</option>
                        <option value="Grade 10" ${data.grade === 'Grade 10' ? 'selected' : ''}>Grade 10</option>
                        <option value="Grade 11" ${data.grade === 'Grade 11' ? 'selected' : ''}>Grade 11</option>
                        <option value="A/L" ${data.grade === 'A/L' ? 'selected' : ''}>A/L</option>
                        <option value="Other" ${data.grade === 'Other' ? 'selected' : ''}>Other</option>
                    </select>
                </td>
                
                <td>
                    <span class="view-mode">${data.phone || '-'}</span>
                    <input type="text" class="edit-mode" id="input_phone_${dbKey}" value="${data.phone || ''}" style="display:none;">
                </td>
                
                <td>
                    <span class="view-mode">${data.fee || 'Not Paid'}</span>
                    <input type="text" class="edit-mode" id="input_fee_${dbKey}" value="${data.fee || ''}" style="display:none;">
                </td>
                
                ${renderDayCell(dbKey, 'Day 1', att['Day 1'])}
                ${renderDayCell(dbKey, 'Day 2', att['Day 2'])}
                ${renderDayCell(dbKey, 'Day 3', att['Day 3'])}
                ${renderDayCell(dbKey, 'Day 4', att['Day 4'])}
                
                <td>
                    <a href="card.html?id=${displayId}" class="btn btn-card">🪪 ID</a>
                    <button class="btn btn-edit" id="btn_edit_${dbKey}" onclick="enableEdit('${dbKey}')">✏️ Edit</button>
                    <button class="btn btn-save" id="btn_save_${dbKey}" onclick="saveStudent('${dbKey}')">💾 Save</button>
                    <button class="btn btn-cancel" id="btn_cancel_${dbKey}" onclick="cancelEdit('${dbKey}')">❌ Cancel</button>
                    <button class="btn btn-delete" onclick="deleteStudent('${dbKey}')">🗑️ Delete</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    });

    function renderDayCell(id, dayName, isPresent) {
        if (isPresent) {
            return `<td>
                <span class="status-present">Present</span>
                <button class="btn btn-reset-day" onclick="removeDayAttendance('${id}', '${dayName}')">❌ Reset</button>
            </td>`;
        } else {
            return `<td><span class="status-absent">Absent</span></td>`;
        }
    }

    function removeDayAttendance(id, dayName) {
        if(confirm(`ID: ${id} ශිෂ්‍යයාගේ ${dayName} Attendance ඉවත් කිරීමට අවශ්‍යද?`)) {
            db.ref(`students/${id}/attendance/${dayName}`).remove().then(() => {
                alert(`${dayName} Attendance ඉවත් කරන ලදී!`);
            });
        }
    }

    function enableEdit(id) {
        const row = document.getElementById(`row_${id}`);
        row.querySelectorAll('.view-mode').forEach(el => el.style.display = 'none');
        row.querySelectorAll('.edit-mode').forEach(el => el.style.display = 'block');
        document.getElementById(`btn_edit_${id}`).style.display = 'none';
        document.getElementById(`btn_save_${id}`).style.display = 'block';
        document.getElementById(`btn_cancel_${id}`).style.display = 'block';
    }

    function cancelEdit(id) {
        const row = document.getElementById(`row_${id}`);
        row.querySelectorAll('.view-mode').forEach(el => el.style.display = 'inline');
        row.querySelectorAll('.edit-mode').forEach(el => el.style.display = 'none');
        document.getElementById(`btn_edit_${id}`).style.display = 'block';
        document.getElementById(`btn_save_${id}`).style.display = 'none';
        document.getElementById(`btn_cancel_${id}`).style.display = 'none';
    }

    function saveStudent(id) {
        const name = document.getElementById(`input_name_${id}`).value.trim();
        const grade = document.getElementById(`input_grade_${id}`).value;
        const phone = document.getElementById(`input_phone_${id}`).value.trim();
        const fee = document.getElementById(`input_fee_${id}`).value.trim();

        db.ref('students/' + id).update({ name, grade, phone, fee }).then(() => {
            alert('තොරතුරු සාර්ථකව Update විය!');
            cancelEdit(id);
        });
    }

    function deleteStudent(id) {
        if (confirm(`ඔබට ID: ${id} මකා දැමීමට අවශ්‍යද?`)) {
            db.ref('students/' + id).remove();
        }
    }
</script>
</body>
</html>
