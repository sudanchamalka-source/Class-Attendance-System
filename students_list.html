<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>සියලුම සිසුන්ගේ ලැයිස්තුව & Filter</title>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background: linear-gradient(135deg, #2C3E50, #4CA1AF); min-height: 100vh; }
        .container { max-width: 1050px; margin: auto; background: rgba(255, 255, 255, 0.96); padding: 25px; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        h2 { color: #2C3E50; text-align: center; margin-top: 0; }
        
        .filter-section { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; background: #eef2f5; padding: 15px; border-radius: 10px; }
        .filter-section input, .filter-section select { flex: 1; min-width: 180px; padding: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #dee2e6; font-size: 0.9em; }
        th { background: linear-gradient(45deg, #007bff, #00c6ff); color: white; }
        tr:hover { background-color: #f1f3f5; }
        
        .btn { padding: 6px 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: white; transition: 0.2s; font-size: 0.85em; }
        .btn-edit { background: linear-gradient(45deg, #ffc107, #fd7e14); color: #212529; }
        .btn-delete { background: linear-gradient(45deg, #dc3545, #bd2130); }
        .btn-qr { background: linear-gradient(45deg, #6f42c1, #a100f4); }
        .btn-save { background: linear-gradient(45deg, #28a745, #20c997); }
        .btn-cancel { background: linear-gradient(45deg, #6c757d, #495057); }
        .badge { padding: 4px 8px; border-radius: 12px; font-weight: bold; font-size: 0.8em; color: white; }
        .badge-paid { background-color: #28a745; }
        .badge-pending { background-color: #ffc107; color: #212529; }
        
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 20px; border-radius: 16px; width: 360px; text-align: center; position: relative; }
        .close-btn { position: absolute; right: 15px; top: 10px; font-size: 20px; cursor: pointer; font-weight: bold; }

        .card-container { display: flex; justify-content: center; margin-top: 15px; }
        #idCard {
            width: 320px;
            height: 202px;
            border-radius: 14px;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            position: relative;
            box-sizing: border-box;
            padding: 12px 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }
        .card-header { font-size: 0.85em; font-weight: 700; letter-spacing: 1px; color: #00d2ff; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 4px; text-align: left; }
        .card-body { display: flex; align-items: center; justify-content: space-between; }
        .student-details { text-align: left; max-width: 170px; }
        .student-name { font-size: 0.95em; font-weight: bold; color: #ffffff; margin-bottom: 4px; }
        .student-id { font-size: 0.85em; color: #f1c40f; font-weight: 600; }
        .qr-box { background: white; padding: 4px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
        .card-footer { font-size: 0.75em; font-weight: bold; color: #00d2ff; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 4px; text-align: right; }
        
        .btn-dl { padding: 8px 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; margin-top: 15px; width: 48%; }
        .btn-jpg { background: linear-gradient(45deg, #ff9900, #ff5500); }
        .btn-pdf { background: linear-gradient(45deg, #dc3545, #bd2130); }

        .nav-links { margin-top: 20px; text-align: center; }
        .nav-links a { margin: 0 10px; text-decoration: none; color: #007bff; font-weight: 600; }
        #statusMsg { padding: 10px; border-radius: 8px; display: none; margin-bottom: 15px; font-weight: bold; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

<div class="container">
    <h2>👥 සියලුම සිසුන්ගේ ලැයිස්තුව & Filter Panel</h2>
    
    <div id="statusMsg"></div>

    <div class="filter-section">
        <input type="text" id="searchInput" placeholder="🔍 නමින් හෝ ID එකෙන් සොයන්න...">
        <input type="month" id="filterMonth">
        <select id="filterFeeStatus">
            <option value="ALL">සියලුම ගාස්තු තත්ත්ව (All Fee Status)</option>
            <option value="Paid">ගෙවා ඇති අය පමණක් (Paid)</option>
            <option value="Pending">ගෙවීමට ඇති අය පමණක් (Pending)</option>
        </select>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>නම</th>
                <th>දුරකථන අංකය</th>
                <th>අදාළ මාසයේ ගාස්තු</th>
                <th>ක්‍රියාමාර්ග (Actions)</th>
            </tr>
        </thead>
        <tbody id="studentsTable">
            <tr><td colspan="5" style="text-align:center;">ලෝඩ් වෙමින් පවතී...</td></tr>
        </tbody>
    </table>

    <div class="nav-links">
        <a href="index.html">← Attendance Scanner</a> |
        <a href="register.html">නව සිසුවෙකු ඇතුළත් කිරීම & ID Card</a> |
        <a href="admin_fees.html">Admin Fee Panel</a>
    </div>
</div>

<!-- Modal for Re-issuing QR ID Card -->
<div id="qrModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h3>🪪 Student ID Card</h3>
        
        <div class="card-container">
            <div id="idCard">
                <div class="card-header">ENGLISH WITH SUDAN SIR</div>
                <div class="card-body">
                    <div class="student-details">
                        <div class="student-name" id="cardName">Name</div>
                        <div class="student-id" id="cardId">ID: STU1001</div>
                    </div>
                    <div class="qr-box">
                        <div id="qrcode"></div>
                    </div>
                </div>
                <div class="card-footer">Sudan Sir</div>
            </div>
        </div>

        <div style="display: flex; justify-content: space-between;">
            <button class="btn-dl btn-jpg" id="downloadJpg">Download JPG 🖼️</button>
            <button class="btn-dl btn-pdf" id="downloadPdf">Download PDF 📄</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAP97Utjqx54gmf9YaMsgWSK96TGTUCuSg",
        authDomain: "class-management-system-8c1a1.firebaseapp.com",
        databaseURL: "https://class-management-system-8c1a1-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "class-management-system-8c1a1",
        storageBucket: "class-management-system-8c1a1.firebasestorage.app",
        messagingSenderId: "759521896885",
        appId: "1:759521896885:web:ab834180d9ab45968791fc",
        measurementId: "G-XZW2VLFXT2"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let allStudents = {};
    let activeCardId = "";
    document.getElementById('filterMonth').value = new Date().toISOString().slice(0, 7);

    let qrcode = new QRCode(document.getElementById("qrcode"), { width: 80, height: 80 });

    function showStatus(msg, isSuccess) {
        const statusDiv = document.getElementById('statusMsg');
        statusDiv.style.display = 'block';
        statusDiv.className = isSuccess ? 'success' : 'error';
        statusDiv.innerText = msg;
        setTimeout(() => { statusDiv.style.display = 'none'; }, 3000);
    }

    database.ref('students').on('value', (snapshot) => {
        allStudents = snapshot.val() || {};
        applyFilters();
    });

    function applyFilters() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const selectedMonth = document.getElementById('filterMonth').value;
        const feeStatus = document.getElementById('filterFeeStatus').value;

        const filtered = {};

        for (let id in allStudents) {
            const student = allStudents[id];
            const matchesQuery = id.toLowerCase().includes(query) || student.name.toLowerCase().includes(query) || student.phone.includes(query);
            
            const monthFee = (student.fees && student.fees[selectedMonth]) ? student.fees[selectedMonth] : "Pending";
            const matchesFee = (feeStatus === "ALL") || (feeStatus === monthFee);

            if (matchesQuery && matchesFee) {
                filtered[id] = { ...student, currentMonthStatus: monthFee };
            }
        }
        renderTable(filtered);
    }

    function renderTable(data) {
        const tbody = document.getElementById('studentsTable');
        tbody.innerHTML = '';

        if (Object.keys(data).length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">සිසුන් කිසිවෙකු සොයාගත නොහැකි විය.</td></tr>';
            return;
        }

        for (let id in data) {
            const student = data[id];
            const badgeClass = student.currentMonthStatus === "Paid" ? "badge-paid" : "badge-pending";
            const badgeText = student.currentMonthStatus === "Paid" ? "Paid ✅" : "Pending ⚠️";

            const tr = document.createElement('tr');
            tr.id = `row-${id}`;
            tr.innerHTML = `
                <td><strong>${id}</strong></td>
                <td class="stu-name">${student.name}</td>
                <td class="stu-phone">${student.phone}</td>
                <td><span class="badge ${badgeClass}">${badgeText}</span></td>
                <td>
                    <button class="btn btn-qr" onclick="getQR('${id}', '${student.name}')">ID Card 🎴</button>
                    <button class="btn btn-edit" onclick="editRow('${id}')">Edit ✏️</button>
                    <button class="btn btn-delete" onclick="deleteStudent('${id}')">Delete 🗑️</button>
                </td>
            `;
            tbody.appendChild(tr);
        }
    }

    function getQR(id, name) {
        activeCardId = id;
        document.getElementById('cardName').innerText = name;
        document.getElementById('cardId').innerText = "ID: " + id;
        qrcode.makeCode(id);
        document.getElementById('qrModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('qrModal').style.display = 'none';
    }

    document.getElementById('downloadJpg').addEventListener('click', () => {
        const card = document.getElementById('idCard');
        html2canvas(card, { scale: 3 }).then(canvas => {
            let a = document.createElement('a');
            a.href = canvas.toDataURL('image/jpeg', 1.0);
            a.download = `${activeCardId}_ID_Card.jpg`;
            a.click();
        });
    });

    document.getElementById('downloadPdf').addEventListener('click', () => {
        const card = document.getElementById('idCard');
        html2canvas(card, { scale: 3 }).then(canvas => {
            const imgData = canvas.toDataURL('image/jpeg', 1.0);
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: [85.6, 54] });
            pdf.addImage(imgData, 'JPEG', 0, 0, 85.6, 54);
            pdf.save(`${activeCardId}_ID_Card.pdf`);
        });
    });

    function editRow(id) {
        const row = document.getElementById(`row-${id}`);
        const nameCell = row.querySelector('.stu-name');
        const phoneCell = row.querySelector('.stu-phone');

        const currentName = nameCell.innerText;
        const currentPhone = phoneCell.innerText;

        nameCell.innerHTML = `<input type="text" id="edit-name-${id}" value="${currentName}">`;
        phoneCell.innerHTML = `<input type="text" id="edit-phone-${id}" value="${currentPhone}">`;

        const actionCell = row.children[4];
        actionCell.innerHTML = `
            <button class="btn btn-save" onclick="saveRow('${id}')">Save 💾</button>
            <button class="btn btn-cancel" onclick="cancelEdit('${id}', '${currentName}', '${currentPhone}')">Cancel ✖</button>
        `;
    }

    function saveRow(id) {
        const newName = document.getElementById(`edit-name-${id}`).value.trim();
        const newPhone = document.getElementById(`edit-phone-${id}`).value.trim();

        if (!newName || !newPhone) {
            showStatus("කරුණාකර සියලු විස්තර ඇතුළත් කරන්න!", false);
            return;
        }

        database.ref('students/' + id).update({
            name: newName,
            phone: newPhone
        }).then(() => {
            showStatus("✅ විස්තර සාර්ථකව Update විය!", true);
        }).catch((err) => {
            showStatus("❌ දෝෂයක් සිදු විය: " + err.message, false);
        });
    }

    function cancelEdit(id, name, phone) {
        applyFilters();
    }

    function deleteStudent(id) {
        if (confirm(`ඔබට ${id} ශිෂ්‍යයාගේ විස්තර පද්ධතියෙන් ඉවත් කිරීමට අවශ්‍යද?`)) {
            database.ref('students/' + id).remove().then(() => {
                showStatus("🗑️ ශිෂ්‍යයා ඉවත් කරන ලදී!", true);
            });
        }
    }

    document.getElementById('searchInput').addEventListener('input', applyFilters);
    document.getElementById('filterMonth').addEventListener('change', applyFilters);
    document.getElementById('filterFeeStatus').addEventListener('change', applyFilters);
</script>

</body>
</html>
