<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student ID Card Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; margin: 0; padding: 20px; background-color: #eef2f5; }
        .wrapper { max-width: 450px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; margin-bottom: 20px; }
        input { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; border: 1px solid #ced4da; border-radius: 6px; }
        button { width: 100%; padding: 12px; margin-top: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: white; transition: 0.2s; }
        .btn-gen { background-color: #007bff; }
        .btn-gen:hover { background-color: #0056b3; }
        .btn-jpg { background-color: #28a745; display: none; }
        .btn-pdf { background-color: #dc3545; display: none; }
        
        .card-container { display: flex; justify-content: center; margin-top: 25px; }
        #idCard {
            width: 320px;
            height: 202px;
            border-radius: 14px;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
            position: relative;
            box-sizing: border-box;
            padding: 12px 15px;
            display: none;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }
        #idCard::before {
            content: "";
            position: absolute;
            top: -50px;
            right: -50px;
            width: 140px;
            height: 140px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
        }
        .card-header {
            font-size: 0.85em;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #00d2ff;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 5px;
            margin-bottom: 5px;
            text-align: left;
        }
        .card-body {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .student-details {
            text-align: left;
            max-width: 170px;
        }
        .student-name {
            font-size: 1em;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 4px;
            word-wrap: break-word;
        }
        .student-id {
            font-size: 0.85em;
            color: #f1c40f;
            font-weight: 600;
        }
        .qr-box {
            background: white;
            padding: 5px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-footer {
            font-size: 0.75em;
            font-weight: bold;
            color: #00d2ff;
            border-top: 1px solid rgba(255,255,255,0.2);
            padding-top: 4px;
            text-align: right;
            letter-spacing: 0.5px;
        }
        .back-link { text-align: center; display: block; margin-top: 20px; color: #007bff; text-decoration: none; }
    </style>
</head>
<body>

<div class="wrapper">
    <h2>Student ID Card Generator</h2>
    
    <input type="text" id="stuName" placeholder="ශිෂ්‍යයාගේ නම (උදා: Kasun Perera)">
    <input type="text" id="stuId" placeholder="ශිෂ්‍ය ID එක (උදා: STU1001)">
    
    <button class="btn-gen" id="genBtn">ID Card එක සාදන්න</button>

    <div class="card-container">
        <div id="idCard">
            <div class="card-header">STUDENT IDENTIFICATION CARD</div>
            <div class="card-body">
                <div class="student-details">
                    <div class="student-name" id="cardName">Name</div>
                    <div class="student-id" id="cardId">ID: STU1001</div>
                </div>
                <div class="qr-box">
                    <div id="qrcode"></div>
                </div>
            </div>
            <div class="card-footer">R.M.S.Chamalka Sir</div>
        </div>
    </div>

    <button class="btn-jpg" id="downloadJpg">Download as JPG Image 🖼️</button>
    <button class="btn-pdf" id="downloadPdf">Download as PDF 📄</button>

    <a href="index.html" class="back-link">← ආපසු Attendance Scanner වෙත</a>
</div>

<script>
    let qrcode = new QRCode(document.getElementById("qrcode"), { width: 85, height: 85 });

    document.getElementById('genBtn').addEventListener('click', () => {
        const name = document.getElementById('stuName').value.trim();
        const id = document.getElementById('stuId').value.trim();

        if (!name || !id) {
            alert("කරුණාකර ශිෂ්‍යයාගේ නම සහ ID එක ඇතුළත් කරන්න!");
            return;
        }

        document.getElementById('cardName').innerText = name;
        document.getElementById('cardId').innerText = "ID: " + id;
        
        qrcode.makeCode(id);

        document.getElementById('idCard').style.display = 'flex';
        document.getElementById('downloadJpg').style.display = 'block';
        document.getElementById('downloadPdf').style.display = 'block';
    });

    document.getElementById('downloadJpg').addEventListener('click', () => {
        const card = document.getElementById('idCard');
        html2canvas(card, { scale: 3 }).then(canvas => {
            let a = document.createElement('a');
            a.href = canvas.toDataURL('image/jpeg', 1.0);
            a.download = `${document.getElementById('stuId').value.trim()}_ID_Card.jpg`;
            a.click();
        });
    });

    document.getElementById('downloadPdf').addEventListener('click', () => {
        const card = document.getElementById('idCard');
        html2canvas(card, { scale: 3 }).then(canvas => {
            const imgData = canvas.toDataURL('image/jpeg', 1.0);
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: [85.6, 54] });
            pdf.addImage(imgData, 'JPEG', 0, 0, 85.6, 54);
            pdf.save(`${document.getElementById('stuId').value.trim()}_ID_Card.pdf`);
        });
    });
</script>

</body>
</html>
