<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student ID Card Generator & Search</title>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; margin: 0; padding: 20px; background: linear-gradient(135deg, #4e54c8, #8f94fb); min-height: 100vh; }
        .wrapper { max-width: 480px; margin: auto; background: rgba(255, 255, 255, 0.95); padding: 25px; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.2); }
        h2 { color: #4e54c8; margin-top: 0; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 8px; }
        button { width: 100%; padding: 12px; margin-top: 10px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; transition: 0.3s; }
        .btn-gen { background: linear-gradient(45deg, #4e54c8, #8f94fb); }
        .btn-gen:hover { opacity: 0.9; transform: translateY(-2px); }
        .btn-jpg { background: linear-gradient(45deg, #ff9900, #ff5500); display: none; }
        .btn-pdf { background: linear-gradient(45deg, #dc3545, #bd2130); display: none; }
        
        .card-container { display: flex; justify-content: center; margin-top: 25px; }
        #idCard {
            width: 320px;
            height: 202px;
            border-radius: 14px;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            position: relative;
            box-sizing: border-box;
            padding: 12px 15px;
            display: none;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }
        .card-header { font-size: 0.85em; font-weight: 700; letter-spacing: 1px; color: #00d2ff; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 4px; text-align: left; }
        .card-body { display: flex; align-items: center; justify-content: space-between; }
        .student-details { text-align: left; max-width: 170px; }
        .student-name { font-size: 0.95em; font-weight: bold; color: #ffffff; margin-bottom: 4px; }
        .student-id { font-size: 0.85em; color: #f1c40f; font-weight: 600; }
        .qr-box { background: white; padding: 4px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
        .card-footer { font-size: 0.75em; font-weight: bold; color: #00d2ff; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 4px; text-align: right; }
        
        .back-link { text-align: center; display: block; margin-top: 20px; color: #4e54c8; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="wrapper">
    <h2>🪪 ID Card & QR Retrieval</h2>
    
    <label>ශිෂ්‍යයා තෝරන්න නැතහොත් ID එක ගහන්න:</label>
    <select id="studentSelect">
        <option value="">-- ලියාපදිංචි සිසුන්ගෙන් තෝරන්න --</option>
    </select>

    <input type="text" id="stuId" placeholder="ශිෂ්‍ය ID එක (උදා: STU1001)">
    <input type="text" id="stuName" placeholder="ශිෂ්‍යයාගේ නම">
    
    <button class="btn-gen" id="genBtn">ID Card එක නැවත ලබාගන්න 🎴</button>

    <div class="card-container">
        <div id="idCard">
            <div class="card-header">STUDENT IDENTIFICATION CARD</div>
            <div class="card-body">
                <div class="student-details">
                    <div class="student-name" id="cardName">Name</div>
                    <div class="student-id" id="cardId">ID: STU1001</div>
                </div>
                <div class="qr-box">
                    <div id="qrcode"></div>
                </div>
            </div>
            <div class="card-footer">R.M.S.Chamalka Sir</div>
        </div>
    </div>

    <div style="display: flex; justify-content: space-between; gap: 10px;">
        <button class="btn-jpg" id="downloadJpg">Download JPG 🖼️</button>
        <button class="btn-pdf" id="downloadPdf">Download PDF 📄</button>
    </div>

    <a href="index.html" class="back-link">← ආපසු Attendance Scanner වෙත</a>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAP97Utjqx54gmf9YaMsgWSK96TGTUCuSg",
        authDomain: "class-management-system-8c1a1.firebaseapp.com",
        databaseURL: "https://class-management-system-8c1a1-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "class-management-system-8c1a1",
        storageBucket: "class-management-system-8c1a1.firebasestorage.app",
        messagingSenderId: "759521896885",
        appId: "1:759521896885:web:ab834180d9ab45968791fc",
        measurementId: "G-XZW2VLFXT2"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    let qrcode = new QRCode(document.getElementById("qrcode"), { width: 80, height: 80 });
    let studentsData = {};

    // Load registered students into dropdown
    database.ref('students').on('value', (snapshot) => {
        studentsData = snapshot.val() || {};
        const select = document.getElementById('studentSelect');
        select.innerHTML = '<option value="">-- ලියාපදිංචි සිසුන්ගෙන් තෝරන්න --</option>';
        for(let id in studentsData) {
            let opt = document.createElement('option');
            opt.value = id;
            opt.innerText = `${id} - ${studentsData[id].name}`;
            select.appendChild(opt);
        }
    });

    document.getElementById('studentSelect').addEventListener('change', (e) => {
        const id = e.target.value;
        if(id && studentsData[id]) {
            document.getElementById('stuId').value = id;
            document.getElementById('stuName').value = studentsData[id].name;
        }
    });

    document.getElementById('genBtn').addEventListener('click', () => {
        const name = document.getElementById('stuName').value.trim();
        const id = document.getElementById('stuId').value.trim();

        if (!name || !id) {
            alert("කරුණාකර ශිෂ්‍යයාගේ නම සහ ID එක ඇතුළත් කරන්න!");
            return;
        }

        document.getElementById('cardName').innerText = name;
        document.getElementById('cardId').innerText = "ID: " + id;
        
        qrcode.makeCode(id);

        document.getElementById('idCard').style.display = 'flex';
        document.getElementById('downloadJpg').style.display = 'block';
        document.getElementById('downloadPdf').style.display = 'block';
    });

    document.getElementById('downloadJpg').addEventListener('click', () => {
        const card = document.getElementById('idCard');
        html2canvas(card, { scale: 3 }).then(canvas => {
            let a = document.createElement('a');
            a.href = canvas.toDataURL('image/jpeg', 1.0);
            a.download = `${document.getElementById('stuId').value.trim()}_ID_Card.jpg`;
            a.click();
        });
    });

    document.getElementById('downloadPdf').addEventListener('click', () => {
        const card = document.getElementById('idCard');
        html2canvas(card, { scale: 3 }).then(canvas => {
            const imgData = canvas.toDataURL('image/jpeg', 1.0);
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: [85.6, 54] });
            pdf.addImage(imgData, 'JPEG', 0, 0, 85.6, 54);
            pdf.save(`${document.getElementById('stuId').value.trim()}_ID_Card.pdf`);
        });
    });
</script>

</body>
</html>
