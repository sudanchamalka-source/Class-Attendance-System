<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parent Portal - English with Sudan Sir</title>
    <link rel="icon" type="image/png" href="logo.png">
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #eef2f5; padding: 20px; }
        .container { max-width: 450px; margin: auto; background: white; padding: 25px; border-radius: 12px; }
        input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background: #0056b3; color: white; border: none; font-weight: bold; cursor: pointer; }
        #infoCard { display: none; margin-top: 20px; padding: 15px; border: 1px solid #ddd; border-radius: 8px; }
        a { text-decoration: none; color: #0056b3; display: block; text-align: center; margin-top: 15px; }
    </style>
</head>
<body>
<div class="container">
    <h2 style="color:#003366; text-align:center;">👨‍👩‍👧‍👦 Parent Portal</h2>
    <input type="text" id="parentStuId" placeholder="ශිෂ්‍ය ID එක ඇතුළත් කරන්න">
    <button onclick="checkStatus()">තොරතුරු පරීක්ෂා කරන්න</button>

    <div id="infoCard">
        <h3 id="pName"></h3>
        <p><strong>පන්ති ගාස්තු තත්ත්වය:</strong> <span id="pFee"></span></p>
    </div>
    <a href="index.html">← Scanner වෙත ආපසු යන්න</a>
</div>
<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAP97Utjqx54gmf9YaMsgWSK96TGTUCuSg",
        authDomain: "class-management-system-8c1a1.firebaseapp.com",
        databaseURL: "https://class-management-system-8c1a1-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "class-management-system-8c1a1",
        storageBucket: "class-management-system-8c1a1.firebasestorage.app",
        messagingSenderId: "759521896885",
        appId: "1:759521896885:web:ab834180d9ab45968791fc",
        measurementId: "G-XZW2VLFXT2"
    };
    firebase.initializeApp(firebaseConfig);

    function checkStatus() {
        const id = document.getElementById('parentStuId').value.trim();
        const month = new Date().toISOString().slice(0, 7);
        if(!id) return;

        firebase.database().ref('students/' + id).once('value', (snapshot) => {
            if(snapshot.exists()) {
                const data = snapshot.val();
                document.getElementById('pName').innerText = "ශිෂ්‍යයා: " + data.name;
                const feeStatus = (data.fees && data.fees[month]) ? data.fees[month] : "Pending";
                document.getElementById('pFee').innerText = feeStatus;
                document.getElementById('infoCard').style.display = 'block';
            } else { alert('ශිෂ්‍යයා සොයාගත නොහැක!'); }
        });
    }
</script>
</body>
</html>
