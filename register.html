<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration & ID Generator</title>
    <link rel="icon" type="image/png" href="logo.png">
    
    <!-- External Libraries for QR Code, Canvas & PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

    <style>
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #003366, #0080ff); margin: 0; padding: 20px; color: #333; }
        .main-wrapper { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; max-width: 1000px; margin: auto; }
        .container { flex: 1; min-width: 320px; max-width: 480px; background: #fff; padding: 25px; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        h2, h3 { color: #003366; text-align: center; margin-top: 0; }
        label { font-weight: bold; margin-top: 10px; display: block; color: #444; font-size: 0.9em; }
        input, select, textarea, button { width: 100%; padding: 11px; margin: 6px 0 12px 0; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-size: 0.95em; }
        textarea { resize: vertical; height: 60px; }
        button { background: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; font-size: 1em; }
        button:hover { opacity: 0.9; }
        .preview-img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; display: none; margin: 5px auto; border: 3px solid #0056b3; }
        
        /* ID Card Preview Area */
        .id-preview-area { flex: 1; min-width: 320px; display: none; flex-direction: column; align-items: center; background: #fff; padding: 25px; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        .credit-card {
            width: 380px; height: 240px; background: linear-gradient(135deg, #001f3f 0%, #0056b3 50%, #00aaff 100%);
            border-radius: 14px; box-shadow: 0 8px 20px rgba(0,0,0,0.3); color: white; padding: 12px 16px; box-sizing: border-box;
            position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between;
        }
        .header { display: flex; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.3); padding-bottom: 6px; }
        .logo { width: 35px; height: 35px; border-radius: 50%; border: 2px solid #fff; margin-right: 10px; }
        .brand-title { font-size: 0.95em; font-weight: bold; color: #fff; }
        .brand-subtitle { font-size: 0.6em; color: #ffd700; text-transform: uppercase; font-weight: bold; }
        .content { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
        .student-photo { width: 75px; height: 90px; border-radius: 8px; border: 2px solid #fff; object-fit: cover; background: #fff; }
        .details { flex: 1; margin-left: 10px; }
        .stu-name { font-size: 0.95em; font-weight: bold; color: #ffffff; }
        .stu-grade { font-size: 0.75em; color: #e0e0e0; margin-top: 2px; }
        .stu-id-tag { display: inline-block; background: #ffd700; color: #001f3f; font-weight: bold; font-size: 0.8em; padding: 2px 8px; border-radius: 10px; margin-top: 4px; }
        .qr-box { background: white; padding: 4px; border-radius: 6px; }
        .footer { display: flex; justify-content: space-between; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 4px; font-size: 0.6em; color: #e0e0e0; }
        
        .actions { margin-top: 15px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; width: 100%; }
        .btn-act { padding: 8px 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: white; font-size: 0.85em; flex: 1; }
        .btn-jpg { background: #28a745; }
        .btn-pdf { background: #dc3545; }
        a { text-decoration: none; color: #0056b3; font-weight: bold; display: block; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

<div class="main-wrapper">
    <!-- Registration Form -->
    <div class="container">
        <h2>📝 ශිෂ්‍ය ලියාපදිංචිය</h2>
        
        <label>ශිෂ්‍ය ID අංකය (Student ID):</label>
        <input type="text" id="stuId" placeholder="උදා: STU1001">

        <label>ශිෂ්‍යයාගේ නම (Full Name):</label>
        <input type="text" id="stuName" placeholder="නම ඇතුළත් කරන්න">

        <label>ශ්‍රේණිය (Grade):</label>
        <select id="stuGrade">
            <option value="">ශ්‍රේණිය තෝරන්න</option>
            <option value="Grade 1">Grade 1</option>
            <option value="Grade 2">Grade 2</option>
            <option value="Grade 3">Grade 3</option>
            <option value="Grade 4">Grade 4</option>
            <option value="Grade 5">Grade 5</option>
            <option value="Grade 6">Grade 6</option>
            <option value="Grade 7">Grade 7</option>
            <option value="Grade 8">Grade 8</option>
            <option value="Grade 9">Grade 9</option>
            <option value="Grade 10">Grade 10</option>
            <option value="Grade 11">Grade 11</option>
            <option value="A/L">A/L</option>
            <option value="Other">Other</option>
        </select>

        <label>WhatsApp දුරකථන අංකය:</label>
        <input type="text" id="stuPhone" placeholder="0771234567">

        <label>වෙනත් තොරතුරු (Other Details):</label>
        <textarea id="stuOther" placeholder="ලිපිනය හෝ වෙනත් සටහන්..."></textarea>

        <label>ශිෂ්‍ය ඡායාරූපය (Student Photo):</label>
        <input type="file" id="stuPhotoInput" accept="image/*" onchange="previewAndCompressPhoto(event)">
        <img id="photoPreview" class="preview-img" alt="Photo Preview">

        <button id="submitBtn" onclick="registerStudent()">ලියාපදිංචි කර ID Card එක බලන්න 🪪</button>
        <a href="index.html">← Scanner වෙත ආපසු යන්න</a>
    </div>

    <!-- ID Card Generated Result Area -->
    <div class="id-preview-area" id="idArea">
        <h3>🪪 Generated ID Card</h3>

        <div class="credit-card" id="card">
            <div class="header">
                <img src="logo.png" alt="Logo" class="logo">
                <div>
                    <div class="brand-title">English with Sudan Sir</div>
                    <div class="brand-subtitle">Student Official Pass</div>
                </div>
            </div>

            <div class="content">
                <img id="cardImg" src="logo.png" alt="Photo" class="student-photo">
                
                <div class="details">
                    <div class="stu-name" id="cardName">Student Name</div>
                    <div class="stu-grade" id="cardGrade">Grade: -</div>
                    <div class="stu-id-tag" id="cardId">ID: STU0000</div>
                </div>

                <div class="qr-box">
                    <div id="qrcode"></div>
                </div>
            </div>

            <div class="footer">
                <span>Authorized Student ID</span>
                <span>Valid Academic Year</span>
            </div>
        </div>

        <div class="actions">
            <button class="btn-act btn-jpg" onclick="downloadJPG()">🖼️ Download JPG</button>
            <button class="btn-act btn-pdf" onclick="downloadPDF()">📄 Download PDF</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAP97Utjqx54gmf9YaMsgWSK96TGTUCuSg",
        authDomain: "class-management-system-8c1a1.firebaseapp.com",
        databaseURL: "https://class-management-system-8c1a1-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "class-management-system-8c1a1",
        storageBucket: "class-management-system-8c1a1.firebasestorage.app",
        messagingSenderId: "759521896885",
        appId: "1:759521896885:web:ab834180d9ab45968791fc",
        measurementId: "G-XZW2VLFXT2"
    };
    firebase.initializeApp(firebaseConfig);

    let base64Photo = "";

    function previewAndCompressPhoto(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const maxWidth = 300;
                    const scaleSize = maxWidth / img.width;
                    canvas.width = maxWidth;
                    canvas.height = img.height * scaleSize;
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    base64Photo = canvas.toDataURL('image/jpeg', 0.7);

                    const preview = document.getElementById('photoPreview');
                    preview.src = base64Photo;
                    preview.style.display = 'block';
                };
            };
            reader.readAsDataURL(file);
        }
    }

    function registerStudent() {
        const id = document.getElementById('stuId').value.trim();
        const name = document.getElementById('stuName').value.trim();
        const grade = document.getElementById('stuGrade').value;
        const phone = document.getElementById('stuPhone').value.trim();
        const other = document.getElementById('stuOther').value.trim();

        if(!id || !name || !phone) { 
            alert('කරුණාකර ශිෂ්‍ය ID එක, නම සහ WhatsApp අංකය ඇතුළත් කරන්න!'); 
            return; 
        }

        firebase.database().ref('students/' + id).set({
            name: name,
            grade: grade || "-",
            phone: phone,
            other: other || "-",
            photo: base64Photo || ""
        }).then(() => {
            alert('ශිෂ්‍යයා සාර්ථකව ලියාපදිංචි විය!');

            // Display ID Card In-Page
            document.getElementById('cardName').innerText = name;
            document.getElementById('cardGrade').innerText = "Grade: " + (grade || "-");
            document.getElementById('cardId').innerText = "ID: " + id;
            if(base64Photo) document.getElementById('cardImg').src = base64Photo;

            // Generate QR Code In-Page
            document.getElementById('qrcode').innerHTML = "";
            new QRCode(document.getElementById("qrcode"), {
                text: id,
                width: 60,
                height: 60
            });

            document.getElementById('idArea').style.display = "flex";
        });
    }

    function downloadJPG() {
        const card = document.getElementById('card');
        const id = document.getElementById('stuId').value.trim();
        html2canvas(card, { scale: 3, useCORS: true }).then(canvas => {
            const link = document.createElement('a');
            link.download = `ID_Card_${id || 'student'}.jpg`;
            link.href = canvas.toDataURL('image/jpeg', 1.0);
            link.click();
        });
    }

    function downloadPDF() {
        const { jsPDF } = window.jspdf;
        const card = document.getElementById('card');
        const id = document.getElementById('stuId').value.trim();

        html2canvas(card, { scale: 3, useCORS: true }).then(canvas => {
            const imgData = canvas.toDataURL('image/png');
            const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: [85.6, 54] });
            pdf.addImage(imgData, 'PNG', 0, 0, 85.6, 54);
            pdf.save(`ID_Card_${id || 'student'}.pdf`);
        });
    }
</script>
</body>
</html>
