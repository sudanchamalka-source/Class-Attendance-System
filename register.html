<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ශිෂ්‍ය ලියාපදිංචිය</title>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background-color: #f8f9fa; }
        .container { max-width: 450px; margin: auto; padding: 25px; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; text-align: center; margin-bottom: 20px; }
        label { font-weight: bold; color: #495057; display: block; margin-top: 12px; }
        input, button { width: 100%; padding: 10px; margin: 6px 0; box-sizing: border-box; border: 1px solid #ced4da; border-radius: 6px; }
        button { background-color: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .back-link { text-align: center; display: block; margin-top: 15px; color: #007bff; text-decoration: none; }
        #statusMsg { margin-top: 15px; padding: 10px; border-radius: 6px; display: none; font-weight: bold; font-size: 0.9em; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<div class="container">
    <h2>ශිෂ්‍ය ලියාපදිංචිය</h2>
    
    <label>ශිෂ්‍ය ID එක:</label>
    <input type="text" id="stuId" placeholder="උදා: STU1001">

    <label>ශිෂ්‍යයාගේ නම:</label>
    <input type="text" id="stuName" placeholder="උදා: Kasun Perera">

    <label>මව්පියන්ගේ WhatsApp අංකය (රටේ කේතය සමඟ):</label>
    <input type="text" id="stuPhone" placeholder="උදා: 94771234567">

    <button id="registerBtn" type="button">ලියාපදිංචි කරන්න</button>

    <div id="statusMsg"></div>

    <a href="index.html" class="back-link">← ආපසු Attendance Scanner වෙත</a>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAP97Utjqx54gmf9YaMsgWSK96TGTUCuSg",
        authDomain: "class-management-system-8c1a1.firebaseapp.com",
        databaseURL: "https://class-management-system-8c1a1-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "class-management-system-8c1a1",
        storageBucket: "class-management-system-8c1a1.firebasestorage.app",
        messagingSenderId: "759521896885",
        appId: "1:759521896885:web:ab834180d9ab45968791fc",
        measurementId: "G-XZW2VLFXT2"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    function showStatus(msg, isSuccess) {
        const statusDiv = document.getElementById('statusMsg');
        statusDiv.style.display = 'block';
        statusDiv.className = isSuccess ? 'success' : 'error';
        statusDiv.innerText = msg;
    }

    document.getElementById('registerBtn').addEventListener('click', () => {
        const id = document.getElementById('stuId').value.trim();
        const name = document.getElementById('stuName').value.trim();
        let phone = document.getElementById('stuPhone').value.trim();

        if (!id || !name || !phone) {
            showStatus("කරුණාකර සියලුම තොරතුරු ඇතුළත් කරන්න!", false);
            return;
        }

        // Clean phone number format
        phone = phone.replace('+', '').replace(/\s+/g, '');
        if (phone.startsWith('0')) {
            phone = '94' + phone.substring(1);
        }

        database.ref('students/' + id).set({
            name: name,
            phone: phone
        }).then(() => {
            showStatus("✅ ශිෂ්‍යයා සාර්ථකව ලියාපදිංචි කරන ලදී!", true);
            document.getElementById('stuId').value = '';
            document.getElementById('stuName').value = '';
            document.getElementById('stuPhone').value = '';
        }).catch((error) => {
            showStatus("❌ දෝෂයක් සිදු විය: " + error.message, false);
        });
    });
</script>

</body>
</html>
