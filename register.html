<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Student Registration</title>
    <link rel="icon" type="image/png" href="logo.png">
    
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 480px; width: 100%; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #003366; margin-top: 0; text-align: center; }
        
        .form-group { margin-bottom: 12px; }
        label { display: block; font-weight: bold; margin-bottom: 4px; color: #003366; font-size: 0.9em; }
        input[type="text"], select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 1em; box-sizing: border-box; }
        
        .btn-submit { background: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; width: 100%; padding: 12px; border-radius: 6px; font-size: 1em; margin-top: 10px; }
        
        .nav-links { margin-top: 20px; text-align: center; font-size: 0.9em; }
        .nav-links a { text-decoration: none; color: #0056b3; font-weight: bold; margin: 0 5px; }
        .status-msg { margin-top: 10px; font-weight: bold; text-align: center; color: #003366; }
    </style>
</head>
<body>

<div class="container">
    <h2>📝 Student Registration</h2>

    <form id="regForm" onsubmit="registerStudent(event)">
        <div class="form-group">
            <label for="stuId">Student ID:</label>
            <input type="text" id="stuId" placeholder="e.g. STU101" required>
        </div>

        <div class="form-group">
            <label for="stuName">Full Name:</label>
            <input type="text" id="stuName" placeholder="Enter Full Name" required>
        </div>

        <div class="form-group">
            <label for="stuGrade">Grade:</label>
            <select id="stuGrade" required>
                <option value="Grade 1">Grade 1</option>
                <option value="Grade 2">Grade 2</option>
                <option value="Grade 3">Grade 3</option>
                <option value="Grade 4">Grade 4</option>
                <option value="Grade 5">Grade 5</option>
                <option value="Grade 6">Grade 6</option>
                <option value="Grade 7">Grade 7</option>
                <option value="Grade 8">Grade 8</option>
                <option value="Grade 9">Grade 9</option>
                <option value="Grade 10">Grade 10</option>
                <option value="Grade 11">Grade 11</option>
                <option value="A/L">A/L</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <div class="form-group">
            <label for="stuPhone">WhatsApp Phone Number:</label>
            <input type="text" id="stuPhone" placeholder="07XXXXXXXX" required>
        </div>

        <div class="form-group">
            <label for="stuPhoto">Photo URL (Optional):</label>
            <input type="text" id="stuPhoto" placeholder="Paste Image Direct Link">
        </div>

        <button type="submit" class="btn-submit">💾 Register Student</button>
    </form>

    <div class="status-msg" id="statusMsg"></div>

    <div class="nav-links">
        <a href="index.html">📸 Scanner</a> | 
        <a href="fee.html">💳 Fee Payment</a> | 
        <a href="students_list.html">📚 Admin Panel</a> | 
        <a href="teacher.html">👨‍🏫 Teacher Dashboard</a>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAP97Utjqx54gmf9YaMsgWSK96TGTUCuSg",
        authDomain: "class-management-system-8c1a1.firebaseapp.com",
        databaseURL: "https://class-management-system-8c1a1-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "class-management-system-8c1a1",
        storageBucket: "class-management-system-8c1a1.firebasestorage.app",
        messagingSenderId: "759521896885",
        appId: "1:759521896885:web:ab834180d9ab45968791fc",
        measurementId: "G-XZW2VLFXT2"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function registerStudent(e) {
        e.preventDefault();
        
        const id = document.getElementById('stuId').value.trim();
        const name = document.getElementById('stuName').value.trim();
        const grade = document.getElementById('stuGrade').value;
        const phone = document.getElementById('stuPhone').value.trim();
        const photo = document.getElementById('stuPhoto').value.trim() || 'logo.png';

        document.getElementById('statusMsg').innerText = "ලියාපදිංචි කරමින් පවතියි...";

        db.ref('students/' + id).set({
            name: name,
            grade: grade,
            phone: phone,
            photo: photo,
            fee: "Not Paid",
            registeredDate: new Date().toISOString().split('T')[0]
        }).then(() => {
            document.getElementById('statusMsg').innerText = `✅ ID: ${id} - ${name} සාර්ථකව ලියාපදිංචි විය!`;
            document.getElementById('regForm').reset();
        }).catch((err) => {
            document.getElementById('statusMsg').innerText = `❌ Error: ${err.message}`;
        });
    }
</script>
</body>
</html>
