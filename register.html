<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration & Edit</title>
    <link rel="icon" type="image/png" href="logo.png">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f4f8;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 520px;
            width: 100%;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }

        h2 { text-align: center; color: #003366; margin-top: 0; }

        .nav-links {
            text-align: center;
            margin-bottom: 20px;
            font-size: 0.9em;
        }

        .nav-links a {
            text-decoration: none;
            color: #0056b3;
            font-weight: bold;
            margin: 0 8px;
        }

        /* Mode Switch Tabs */
        .tab-switcher {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid #0056b3;
            background: white;
            color: #0056b3;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95em;
        }

        .tab-btn.active {
            background: #0056b3;
            color: white;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            background: #e9ecef;
            padding: 12px;
            border-radius: 8px;
        }

        .search-box input {
            flex: 1;
        }

        .btn-search {
            background: #003366;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 0 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #0056b3;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1em;
        }

        .preview-box {
            text-align: center;
            margin-top: 10px;
        }

        .preview-box img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #0056b3;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            color: white;
        }

        .btn-green { background: #28a745; }
        .btn-green:hover { background: #218838; }

        .btn-orange { background: #ff9800; }
        .btn-orange:hover { background: #e68a00; }
    </style>
</head>
<body>

    <div class="container">
        <h2 id="pageTitle">📝 Register New Student</h2>
        
        <div class="nav-links">
            <a href="index.html">📸 Scanner</a> | 
            <a href="register.html">+ New Register</a> | 
            <a href="fee.html">💳 Fee Payment</a> | 
            <a href="students_list.html">📚 Admin Panel</a>
        </div>

        <!-- Mode Tabs -->
        <div class="tab-switcher">
            <button class="tab-btn active" id="tabRegister" onclick="switchMode('new')">➕ Register New</button>
            <button class="tab-btn" id="tabEdit" onclick="switchMode('edit')">✏️ Edit Existing</button>
        </div>

        <!-- Search Bar (Visible only in Edit Mode) -->
        <div class="search-box" id="searchContainer" style="display: none;">
            <input type="text" id="searchId" placeholder="Enter Student ID / Index No...">
            <button type="button" class="btn-search" onclick="loadStudentData()">🔍 Search</button>
        </div>

        <form id="studentForm">
            <div class="form-group">
                <label for="studentId">Student ID / Index No:</label>
                <input type="text" id="studentId" placeholder="e.g. STU1001" required>
            </div>

            <div class="form-group">
                <label for="fullName">Full Name:</label>
                <input type="text" id="fullName" placeholder="Enter Full Name" required>
            </div>

            <div class="form-group">
                <label for="grade">Grade / Class:</label>
                <select id="grade" required>
                    <option value="">Select Grade</option>
                    <option value="Grade 1">Grade 1</option>
                    <option value="Grade 2">Grade 2</option>
                    <option value="Grade 3">Grade 3</option>
                    <option value="Grade 4">Grade 4</option>
                    <option value="Grade 5">Grade 5</option>
                    <option value="Grade 6">Grade 6</option>
                    <option value="Grade 7">Grade 7</option>
                    <option value="Grade 8">Grade 8</option>
                    <option value="Grade 9">Grade 9</option>
                    <option value="Grade 10">Grade 10</option>
                    <option value="Grade 11">Grade 11</option>
                    <option value="A/L">A/L</option>
                    <option value="A/L English">A/L English</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="phone">WhatsApp / Phone Number:</label>
                <input type="text" id="phone" placeholder="07XXXXXXXX" required>
            </div>

            <div class="form-group">
                <label for="photo">Student Photo:</label>
                <input type="file" id="photo" accept="image/*" onchange="previewImage(event)">
                <div class="preview-box">
                    <img id="imgPreview" src="logo.png" alt="Preview" style="display: none;">
                </div>
            </div>

            <button type="submit" id="btnSubmit" class="btn-submit btn-green">➕ Save New Student</button>
        </form>
    </div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAP97Utjqx54gmf9YaMsgWSK96TGTUCuSg",
        authDomain: "class-management-system-8c1a1.firebaseapp.com",
        databaseURL: "https://class-management-system-8c1a1-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "class-management-system-8c1a1",
        storageBucket: "class-management-system-8c1a1.firebasestorage.app",
        messagingSenderId: "759521896885",
        appId: "1:759521896885:web:ab834180d9ab45968791fc",
        measurementId: "G-XZW2VLFXT2"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentMode = 'new'; // 'new' or 'edit'
    let currentPhotoBase64 = '';

    function switchMode(mode) {
        currentMode = mode;
        const pageTitle = document.getElementById('pageTitle');
        const tabRegister = document.getElementById('tabRegister');
        const tabEdit = document.getElementById('tabEdit');
        const searchContainer = document.getElementById('searchContainer');
        const studentIdInput = document.getElementById('studentId');
        const btnSubmit = document.getElementById('btnSubmit');

        resetForm();

        if (mode === 'new') {
            pageTitle.innerText = '📝 Register New Student';
            tabRegister.classList.add('active');
            tabEdit.classList.remove('active');
            searchContainer.style.display = 'none';
            studentIdInput.removeAttribute('readonly');
            btnSubmit.innerText = '➕ Save New Student';
            btnSubmit.className = 'btn-submit btn-green';
        } else {
            pageTitle.innerText = '✏️ Edit Student Details';
            tabEdit.classList.add('active');
            tabRegister.classList.remove('active');
            searchContainer.style.display = 'flex';
            studentIdInput.setAttribute('readonly', 'true');
            btnSubmit.innerText = '💾 Update Student Details';
            btnSubmit.className = 'btn-submit btn-orange';
        }
    }

    function previewImage(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                currentPhotoBase64 = e.target.result;
                const img = document.getElementById('imgPreview');
                img.src = currentPhotoBase64;
                img.style.display = 'inline-block';
            };
            reader.readAsDataURL(file);
        }
    }

    function loadStudentData() {
        const idToSearch = document.getElementById('searchId').value.trim();
        if (!idToSearch) {
            alert('⚠️ Enter a Student ID to search.');
            return;
        }

        db.ref('students/' + idToSearch).once('value', (snapshot) => {
            if (!snapshot.exists()) {
                alert('❌ No student found with ID: ' + idToSearch);
                resetForm();
                return;
            }

            const data = snapshot.val();
            document.getElementById('studentId').value = data.id || data.stuId || idToSearch;
            document.getElementById('fullName').value = data.name || '';
            document.getElementById('grade').value = data.grade || '';
            document.getElementById('phone').value = data.phone || data.whatsapp || '';

            currentPhotoBase64 = data.photo || data.photoUrl || '';
            const img = document.getElementById('imgPreview');
            if (currentPhotoBase64) {
                img.src = currentPhotoBase64;
                img.style.display = 'inline-block';
            } else {
                img.style.display = 'none';
            }

            alert('✅ Student details loaded!');
        });
    }

    function resetForm() {
        document.getElementById('studentForm').reset();
        document.getElementById('searchId').value = '';
        const img = document.getElementById('imgPreview');
        img.style.display = 'none';
        img.src = '';
        currentPhotoBase64 = '';
    }

    document.getElementById('studentForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const id = document.getElementById('studentId').value.trim();
        const name = document.getElementById('fullName').value.trim();
        const grade = document.getElementById('grade').value;
        const phone = document.getElementById('phone').value.trim();

        if (!id) {
            alert('⚠️ Student ID is required!');
            return;
        }

        const photoUrl = currentPhotoBase64 || 'logo.png';

        if (currentMode === 'new') {
            // New Registration Logic
            db.ref('students/' + id).once('value', (snapshot) => {
                if (snapshot.exists()) {
                    alert('⚠️ A student with ID "' + id + '" already exists! Switch to Edit tab to modify.');
                    return;
                }

                db.ref('students/' + id).set({
                    id: id,
                    stuId: id,
                    name: name,
                    grade: grade,
                    phone: phone,
                    whatsapp: phone,
                    photo: photoUrl,
                    photoUrl: photoUrl,
                    fee: 'Not Paid',
                    registeredAt: new Date().toISOString()
                }).then(() => {
                    alert('✅ Student registered successfully!');
                    resetForm();
                }).catch((err) => {
                    alert('❌ Error: ' + err.message);
                });
            });

        } else {
            // Edit / Update Existing Logic
            db.ref('students/' + id).update({
                name: name,
                grade: grade,
                phone: phone,
                whatsapp: phone,
                photo: photoUrl,
                photoUrl: photoUrl
            }).then(() => {
                alert('✅ Student details updated successfully!');
                resetForm();
            }).catch((err) => {
                alert('❌ Error updating: ' + err.message);
            });
        }
    });
</script>
</body>
</html>
