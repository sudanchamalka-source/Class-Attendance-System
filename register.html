<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - English with Sudan Sir</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="logo.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #003366, #0080ff); margin: 0; padding: 20px; color: #333; }
        .container { max-width: 450px; margin: auto; background: #fff; padding: 25px; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); text-align: center; }
        .logo { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; }
        h2 { color: #003366; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        #cardArea { display: none; margin-top: 20px; padding: 15px; border: 2px dashed #003366; border-radius: 12px; background: #f9f9f9; }
        #qrcode { display: flex; justify-content: center; margin: 15px 0; }
        .print-btn { background: #0056b3; }
        a { text-decoration: none; color: #0056b3; font-weight: bold; display: inline-block; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <img src="logo.png" alt="Logo" class="logo">
    <h2>📝 ශිෂ්‍ය ලියාපදිංචිය</h2>

    <input type="text" id="stuId" placeholder="ශිෂ්‍ය ID (උදා: STU1001)">
    <input type="text" id="stuName" placeholder="සම්පූර්ණ නම">
    <input type="text" id="stuPhone" placeholder="WhatsApp දුරකථන අංකය (උදා: 94771234567)">
    <button onclick="registerStudent()">ලියාපදිංචි කරන්න</button>

    <div id="cardArea">
        <h3 style="color:#003366; margin:0;">English with Sudan Sir</h3>
        <p style="margin:5px 0;"><strong id="cardName"></strong></p>
        <p style="margin:0; color:#666;">ID: <span id="cardId"></span></p>
        <div id="qrcode"></div>
        <button class="print-btn" onclick="window.print()">🖨️ ID Card එක Print කරන්න</button>
    </div>

    <a href="index.html">← Scanner වෙත ආපසු යන්න</a>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAP97Utjqx54gmf9YaMsgWSK96TGTUCuSg",
        authDomain: "class-management-system-8c1a1.firebaseapp.com",
        databaseURL: "https://class-management-system-8c1a1-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "class-management-system-8c1a1",
        storageBucket: "class-management-system-8c1a1.firebasestorage.app",
        messagingSenderId: "759521896885",
        appId: "1:759521896885:web:ab834180d9ab45968791fc",
        measurementId: "G-XZW2VLFXT2"
    };
    firebase.initializeApp(firebaseConfig);

    function registerStudent() {
        const id = document.getElementById('stuId').value.trim();
        const name = document.getElementById('stuName').value.trim();
        const phone = document.getElementById('stuPhone').value.trim();

        if(!id || !name || !phone) { alert('සියලු තොරතුරු ඇතුළත් කරන්න!'); return; }

        firebase.database().ref('students/' + id).set({
            name: name,
            phone: phone
        }).then(() => {
            alert('ලියාපදිංචිය සාර්ථකයි!');
            document.getElementById('cardName').innerText = name;
            document.getElementById('cardId').innerText = id;
            document.getElementById('qrcode').innerHTML = "";
            new QRCode(document.getElementById("qrcode"), { text: id, width: 128, height: 128 });
            document.getElementById('cardArea').style.display = 'block';
        });
    }
</script>
</body>
</html>
