    <meta charset="UTF-8">

    <title>ශිෂ්‍ය ලියාපදිංචිය - Class Management</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background-color: #f8f9fa; }
        .form-container { max-width: 400px; margin: auto; padding: 25px; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; text-align: center; }
        label { font-weight: bold; color: #495057; display: block; margin-top: 10px; }
        input, select, button { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; border: 1px solid #ced4da; border-radius: 6px; }
        button { background-color: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 15px; font-size: 1em; }
        button:hover { background-color: #218838; }
        .back-link { text-align: center; display: block; margin-top: 15px; color: #007bff; text-decoration: none; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>නව ශිෂ්‍යයෙකු ඇතුළත් කිරීම</h2>
    
    <label>ශිෂ්‍ය ID (QR Code එකේ අංකය):</label>
    <input type="text" id="studentId" placeholder="උදා: STU1001" required>

    <label>සම්පූර්ණ නම:</label>
    <input type="text" id="studentName" placeholder="උදා: කසුන් පෙරේරා" required>

    <label>WhatsApp දුරකථන අංකය (සමඟ 94):</label>
    <input type="text" id="phone" placeholder="9477XXXXXXX" required>

    <label>මාසික ගාස්තු ගෙවීම් තත්ත්වය:</label>
    <select id="feeStatus">
        <option value="Paid">ගෙවා ඇත (Paid)</option>
        <option value="Pending">ගෙවීමට ඇත (Pending)</option>
    </select>

    <button onclick="registerStudent()">දත්ත ඇතුළත් කරන්න</button>
    <a href="index.html" class="back-link">← ආපසු Attendance Scanner වෙත</a>
</div>

<script>
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
        databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT_ID.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    function registerStudent() {
        const id = document.getElementById('studentId').value.trim();
        const name = document.getElementById('studentName').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const feeStatus = document.getElementById('feeStatus').value;

        if (!id || !name || !phone) {
            alert("කරුණාකර සියලු විස්තර ඇතුළත් කරන්න!");
            return;
        }

        database.ref('students/' + id).set({
            name: name,
            phone: phone,
            feeStatus: feeStatus
        }).then(() => {
            alert("ශිෂ්‍යයා සාර්ථකව ලියාපදිංචි කරන ලදී!");
            document.getElementById('studentId').value = '';
            document.getElementById('studentName').value = '';
            document.getElementById('phone').value = '';
        }).catch((error) => {
            alert("දෝෂයක් සිදු විය: " + error.message);
        });
    }
</script>

</body>
</html>
