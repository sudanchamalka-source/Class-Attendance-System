<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ගාස්තු කළමනාකරණය - Admin Panel</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background-color: #f8f9fa; }
        .container { max-width: 450px; margin: auto; padding: 25px; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; text-align: center; }
        label { font-weight: bold; color: #495057; display: block; margin-top: 12px; }
        input, select, button { width: 100%; padding: 10px; margin: 6px 0; box-sizing: border-box; border: 1px solid #ced4da; border-radius: 6px; }
        button { background-color: #17a2b8; color: white; border: none; font-weight: bold; cursor: pointer; }
        .btn-qr { background-color: #6c757d; margin-bottom: 10px; }
        #reader { width: 100%; margin-top: 10px; display: none; border-radius: 8px; overflow: hidden; }
        .student-info { margin-top: 15px; padding: 15px; background: #e9ecef; border-radius: 8px; display: none; text-align: left; }
        .save-btn { background-color: #28a745; margin-top: 12px; }
        .back-link { text-align: center; display: block; margin-top: 15px; color: #007bff; text-decoration: none; }
        #statusMsg { margin-top: 15px; padding: 10px; border-radius: 6px; display: none; font-weight: bold; font-size: 0.9em; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<div class="container">
    <h2>ගාස්තු තත්ත්වය Update කිරීම</h2>

    <button class="btn-qr" id="qrBtn" type="button">QR Code Scan කරන්න 📷</button>
    <div id="reader"></div>

    <label>ශිෂ්‍ය ID එක ඇතුළත් කරන්න:</label>
    <input type="text" id="searchId" placeholder="උදා: STU1001">
    <button id="searchBtn" type="button">සොයන්න</button>

    <div id="statusMsg"></div>

    <div id="studentInfo" class="student-info">
        <p><strong>නම:</strong> <span id="displayName">-</span></p>
        <p><strong>දුරකථන අංකය:</strong> <span id="displayPhone">-</span></p>
        
        <label>අදාළ මාසය (Month):</label>
        <input type="month" id="selectedMonth">

        <label>ගාස්තු තත්ත්වය:</label>
        <select id="updateFeeStatus">
            <option value="Paid">ගෙවා ඇත (Paid)</option>
            <option value="Pending">ගෙවීමට ඇත (Pending)</option>
        </select>

        <button class="save-btn" id="saveFeeBtn" type="button">තත්ත්වය වෙනස් කර Message යවන්න</button>
    </div>

    <a href="index.html" class="back-link">← ආපසු Attendance Scanner වෙත</a>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAP97Utjqx54gmf9YaMsgWSK96TGTUCuSg",
        authDomain: "class-management-system-8c1a1.firebaseapp.com",
        databaseURL: "https://class-management-system-8c1a1-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "class-management-system-8c1a1",
        storageBucket: "class-management-system-8c1a1.firebasestorage.app",
        messagingSenderId: "759521896885",
        appId: "1:759521896885:web:ab834180d9ab45968791fc",
        measurementId: "G-XZW2VLFXT2"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let currentStudentId = "";
    let currentStudentData = null;
    let html5QrcodeScanner = null;

    document.getElementById('selectedMonth').value = new Date().toISOString().slice(0, 7);

    function showStatus(msg, isSuccess) {
        const statusDiv = document.getElementById('statusMsg');
        statusDiv.style.display = 'block';
        statusDiv.className = isSuccess ? 'success' : 'error';
        statusDiv.innerText = msg;
    }

    document.getElementById('qrBtn').addEventListener('click', () => {
        const readerDiv = document.getElementById("reader");
        if (readerDiv.style.display === "block") {
            readerDiv.style.display = "none";
            if (html5QrcodeScanner) html5QrcodeScanner.clear();
        } else {
            readerDiv.style.display = "block";
            html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 220 });
            html5QrcodeScanner.render((decodedText) => {
                document.getElementById('searchId').value = decodedText;
                html5QrcodeScanner.clear();
                readerDiv.style.display = "none";
                searchStudent();
            });
        }
    });

    document.getElementById('searchBtn').addEventListener('click', searchStudent);

    function searchStudent() {
        currentStudentId = document.getElementById('searchId').value.trim();
        if (!currentStudentId) {
            showStatus("කරුණාකර ID අංකයක් ඇතුළත් කරන්න!", false);
            return;
        }

        database.ref('students/' + currentStudentId).once('value').then((snapshot) => {
            if (snapshot.exists()) {
                currentStudentData = snapshot.val();
                document.getElementById('displayName').innerText = currentStudentData.name;
                document.getElementById('displayPhone').innerText = currentStudentData.phone;
                document.getElementById('studentInfo').style.display = "block";
                document.getElementById('statusMsg').style.display = "none";
                loadMonthFeeStatus();
            } else {
                showStatus("⚠️ මෙම ID එකට අදාළ ශිෂ්‍යයෙකු සොයාගත නොහැකි විය!", false);
                document.getElementById('studentInfo').style.display = "none";
            }
        });
    }

    function loadMonthFeeStatus() {
        const selectedMonth = document.getElementById('selectedMonth').value;
        if (!currentStudentId || !selectedMonth) return;

        database.ref('students/' + currentStudentId + '/fees/' + selectedMonth).once('value').then((snapshot) => {
            if (snapshot.exists()) {
                document.getElementById('updateFeeStatus').value = snapshot.val();
            } else {
                document.getElementById('updateFeeStatus').value = "Pending";
            }
        });
    }

    document.getElementById('saveFeeBtn').addEventListener('click', () => {
        const selectedMonth = document.getElementById('selectedMonth').value;
        const newStatus = document.getElementById('updateFeeStatus').value;

        if (!selectedMonth) {
            showStatus("කරුණාකර මාසය තෝරන්න!", false);
            return;
        }

        database.ref('students/' + currentStudentId + '/fees/' + selectedMonth).set(newStatus)
        .then(() => {
            showStatus(`✅ ${selectedMonth} ගාස්තු Update විය! WhatsApp වෙත යොමු කෙරේ...`, true);
            
            const statusText = newStatus === "Paid" ? "ලැබී ඇත (Paid) ✅" : "ලැබී නොමැත (Pending) ⚠️";
            const message = encodeURIComponent(
                `*පන්ති ගාස්තු රිසිට්පත*\n\n` +
                `නම: ${currentStudentData.name}\n` +
                `අදාළ මාසය: ${selectedMonth}\n` +
                `ගාස්තු තත්ත්වය: ${statusText}\n\n` +
                `ස්තූතියි!`
            );

            setTimeout(() => {
                window.location.href = `https://wa.me/${currentStudentData.phone}?text=${message}`;
            }, 1000);
        })
        .catch((error) => {
            showStatus("❌ දෝෂයක් සිදු විය: " + error.message, false);
        });
    });
</script>

</body>
</html>
