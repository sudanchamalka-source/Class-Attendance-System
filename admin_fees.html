<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Fees Management</title>
    <link rel="icon" type="image/png" href="logo.png">
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; padding: 20px; }
        .container { max-width: 450px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #003366; text-align: center; }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background: #fd7e14; color: white; font-weight: bold; border: none; cursor: pointer; }
        a { text-decoration: none; color: #0056b3; display: block; text-align: center; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2>💳 පන්ති ගාස්තු කළමනාකරණය</h2>
    <input type="text" id="adminStuId" placeholder="ශිෂ්‍ය ID එක ඇතුළත් කරන්න">
    <input type="month" id="feeMonth">
    <select id="feeStatus">
        <option value="Paid">Paid (ගෙවා ඇත)</option>
        <option value="Pending">Pending (ගෙවීමට ඇත)</option>
    </select>
    <button onclick="updateFeeStatus()">තත්ත්වය යාවත්කාලීන කරන්න</button>
    <a href="index.html">← Scanner වෙත ආපසු යන්න</a>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAP97Utjqx54gmf9YaMsgWSK96TGTUCuSg",
        authDomain: "class-management-system-8c1a1.firebaseapp.com",
        databaseURL: "https://class-management-system-8c1a1-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "class-management-system-8c1a1",
        storageBucket: "class-management-system-8c1a1.firebasestorage.app",
        messagingSenderId: "759521896885",
        appId: "1:759521896885:web:ab834180d9ab45968791fc",
        measurementId: "G-XZW2VLFXT2"
    };
    firebase.initializeApp(firebaseConfig);

    document.getElementById('feeMonth').value = new Date().toISOString().slice(0, 7);

    function updateFeeStatus() {
        const id = document.getElementById('adminStuId').value.trim();
        const month = document.getElementById('feeMonth').value;
        const status = document.getElementById('feeStatus').value;

        if(!id || !month) { alert('සියලු තොරතුරු ඇතුළත් කරන්න!'); return; }

        firebase.database().ref('students/' + id + '/fees/' + month).set(status).then(() => {
            alert('ගාස්තු තත්ත්වය සාර්ථකව වෙනස් විය!');
        });
    }
</script>
</body>
</html>
