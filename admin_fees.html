<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>පරිපාලන පුවරුව - English with Sudan Sir</title>
  <meta name="theme-color" content="#14246b">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="shared.css">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="shared.js"></script>
</head>
<body>
<div id="chrome"></div>

<main class="wrap narrow">
  <h2 class="ribbon">පරිපාලන පුවරුව</h2>

  <section class="card" style="--accent: var(--purple)">
    <h3>ශිෂ්‍යයා තෝරන්න</h3>
    <div class="row">
      <div class="grow">
        <label class="label" for="stuId">ශිෂ්‍ය හැඳුනුම් අංකය</label>
        <input type="text" id="stuId" placeholder="උදා: STU1001" autocomplete="off">
      </div>
      <button type="button" class="btn navy" id="findBtn">සොයන්න</button>
    </div>
    <div id="stuBox"></div>
  </section>

  <section class="card" style="--accent: var(--blue)">
    <h3>පැමිණීම සටහන් කිරීම</h3>
    <p class="hint" id="attHint">අද දින පන්තියට පැමිණි දින තෝරන්න.</p>
    <div class="chips" id="dayChips"></div>
    <button type="button" class="btn block" id="attBtn" disabled>පැමිණීම සටහන් කරන්න</button>
  </section>

  <section class="card" style="--accent: var(--green)">
    <h3>පන්ති ගාස්තු සටහන් කිරීම</h3>
    <div class="field">
      <label class="label" for="feeMonth">අදාළ මාසය</label>
      <select id="feeMonth"></select>
    </div>
    <div class="field">
      <label class="label" for="feeStatus">ගෙවීම් තත්ත්වය</label>
      <select id="feeStatus">
        <option value="Paid">ගෙවා ඇත</option>
        <option value="Pending">ගෙවා නැත</option>
      </select>
    </div>
    <button type="button" class="btn green block" id="feeBtn" disabled>ගාස්තුව සටහන් කරන්න</button>
  </section>

  <div id="result"></div>
</main>

<script>
  mountChrome();
  fillMonths($('feeMonth'));
  $('feeMonth').value = currentMonthKey();

  // දින 4 සඳහා checkbox (HTML හතර වරක් ලිවීම වෙනුවට එක් වරක් නිර්මාණය)
  $('dayChips').innerHTML = DAYS.map(d =>
    `<label class="chip"><input type="checkbox" value="${d}">${DAY_SI[d]}</label>`).join('');
  const dayBoxes = () => [...document.querySelectorAll('#dayChips input')];

  let cur = null; // සොයාගත් ශිෂ්‍යයා { key, data }

  const setActions = on => { $('attBtn').disabled = !on; $('feeBtn').disabled = !on; };

  async function lookup() {
    const id = $('stuId').value.trim();
    $('result').innerHTML = '';
    if (!id) return toast('ශිෂ්‍ය හැඳුනුම් අංකය ඇතුළත් කරන්න.', 'bad');
    cur = await findStudent(id);
    renderStudentBox($('stuBox'), cur);
    setActions(!!cur);
    if (!cur) return toast('එම අංකයට අදාළ ශිෂ්‍යයෙකු හමු නොවිණි.', 'bad');
    // දැනටමත් සටහන් වී ඇති දින පෙන්වන්න
    const att = cur.data.attendance || {};
    dayBoxes().forEach(b => b.checked = att[b.value] === true);
  }
  $('findBtn').addEventListener('click', lookup);
  $('stuId').addEventListener('keydown', e => { if (e.key === 'Enter') lookup(); });

  function showResult(title, msg) {
    const phone = studentPhone(cur.data);
    const link = waLink(phone, msg);
    $('result').innerHTML = `<div class="notice ${link ? '' : 'warn'}"><strong>${title}</strong><br>` +
      (link ? `<a class="btn wa" href="${link}" target="_blank" rel="noopener">වට්ස්ඇප් පණිවිඩය යවන්න</a>`
            : 'මෙම ශිෂ්‍යයාට දුරකථන අංකයක් සටහන් කර නැති නිසා වට්ස්ඇප් පණිවිඩය යැවිය නොහැක.') + '</div>';
  }

  $('attBtn').addEventListener('click', async () => {
    if (!cur) return;
    const picked = dayBoxes().filter(b => b.checked).map(b => b.value);
    const flags = Object.fromEntries(dayBoxes().map(b => [b.value, b.checked]));
    let saved;
    try { saved = await saveAttendance(cur, flags); }
    catch (err) { return toast('සටහන් කිරීම අසාර්ථකයි: ' + err.message, 'bad'); }
    const today = saved.date;

    const name = cur.data.name || cur.key;
    const days = picked.length ? picked.map(d => DAY_SI[d]).join(', ') : 'පැමිණීම සටහන් විය';
    showResult('පැමිණීම සටහන් විය.',
      `ආදරණීය දෙමාපියනි,\nඔබගේ දරුවා *${name}* (${cur.key}) ${today} දින පන්තියට පැමිණි බව දන්වා සිටිමු.\nපැමිණි දින: ${days}\nපන්තිය: *${CONFIG.brand}*`);
    toast('පැමිණීම සටහන් විය.', 'ok');
  });

  $('feeBtn').addEventListener('click', async () => {
    if (!cur) return;
    const month = $('feeMonth').value, status = $('feeStatus').value;
    try {
      await db.ref(`students/${cur.key}/fees/${month}`).set(status);
    } catch (err) { return toast('සටහන් කිරීම අසාර්ථකයි: ' + err.message, 'bad'); }

    const name = cur.data.name || cur.key;
    showResult('පන්ති ගාස්තුව සටහන් විය.',
      `ආදරණීය දෙමාපියනි,\n*${name}* (${cur.key}) ගේ *${MONTH_SI[month]}* මාසයේ පන්ති ගාස්තුව: *${STATUS_SI[status]}*.\nස්තූතියි!\n- *${CONFIG.brand}*`);
    toast('ගාස්තුව සටහන් විය.', 'ok');
    cur.data.fees = { ...(cur.data.fees || {}), [month]: status };
    renderStudentBox($('stuBox'), cur);
  });
</script>
</body>
</html>
