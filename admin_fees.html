    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ගාස්තු කළමනාකරණය - Admin Panel</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background-color: #f8f9fa; }
        .container { max-width: 450px; margin: auto; padding: 25px; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; text-align: center; }
        label { font-weight: bold; color: #495057; display: block; margin-top: 10px; }
        input, select, button { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; border: 1px solid #ced4da; border-radius: 6px; }
        button { background-color: #17a2b8; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #138496; }
        .student-info { margin-top: 15px; padding: 15px; background: #e9ecef; border-radius: 8px; display: none; text-align: left; }
        .save-btn { background-color: #28a745; margin-top: 10px; }
        .save-btn:hover { background-color: #218838; }
        .back-link { text-align: center; display: block; margin-top: 15px; color: #007bff; text-decoration: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>ගාස්තු තත්ත්වය Update කිරීම</h2>

    <label>ශිෂ්‍ය ID එක ඇතුළත් කරන්න:</label>
    <input type="text" id="searchId" placeholder="උදා: STU1001">
    <button onclick="searchStudent()">සොයන්න</button>

    <div id="studentInfo" class="student-info">
        <p><strong>නම:</strong> <span id="displayName">-</span></p>
        <p><strong>දුරකථන අංකය:</strong> <span id="displayPhone">-</span></p>
        
        <label>වත්මන් ගාස්තු තත්ත්වය:</label>
        <select id="updateFeeStatus">
            <option value="Paid">ගෙවා ඇත (Paid)</option>
            <option value="Pending">ගෙවීමට ඇත (Pending)</option>
        </select>

        <button class="save-btn" onclick="updateFeeStatus()">තත්ත්වය වෙනස් කරන්න</button>
    </div>

    <a href="index.html" class="back-link">← ආපසු Attendance Scanner වෙත</a>
</div>

<script>
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
        databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT_ID.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let currentStudentId = "";

    function searchStudent() {
        currentStudentId = document.getElementById('searchId').value.trim();
        if (!currentStudentId) {
            alert("කරුණාකර ID අංකයක් ඇතුළත් කරන්න!");
            return;
        }

        database.ref('students/' + currentStudentId).once('value').then((snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.val();
                document.getElementById('displayName').innerText = data.name;
                document.getElementById('displayPhone').innerText = data.phone;
                document.getElementById('updateFeeStatus').value = data.feeStatus || "Pending";
                document.getElementById('studentInfo').style.display = "block";
            } else {
                alert("මෙම ID එකට අදාළ ශිෂ්‍යයෙකු සොයාගත නොහැකි විය!");
                document.getElementById('studentInfo').style.display = "none";
            }
        });
    }

    function updateFeeStatus() {
        const newStatus = document.getElementById('updateFeeStatus').value;

        database.ref('students/' + currentStudentId).update({
            feeStatus: newStatus
        }).then(() => {
            alert("ගාස්තු තත්ත්වය සාර්ථකව Update විය!");
        }).catch((error) => {
            alert("දෝෂයක් සිදු විය: " + error.message);
        });
    }
</script>

</body>
</html>
